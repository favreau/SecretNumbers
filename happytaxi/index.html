<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Happy Taxi — Jeu de conduite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100%;
    height: 100dvh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 30;
    background: linear-gradient(180deg, rgba(10,10,15,0.97) 0%, rgba(10,10,15,0.7) 85%, transparent 100%);
    padding: 10px 12px 24px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  #ui input {
    background: #1a1a24;
    border: 1px solid #333;
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 16px;
    flex: 1 1 130px;
    min-width: 0;
  }
  #ui button {
    background: #2a6df4;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  #ui button:disabled { background: #333; }
  #mapLayerSelect {
    background: #1a1a24; border: 1px solid #444; color: #eee;
    padding: 9px 10px; border-radius: 8px; font-size: 13px; max-width: 100%;
  }
  #gpsFollowLabel { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #ddd; white-space: nowrap; }
  #gpsFollow { width: 16px; height: 16px; accent-color: #2a6df4; }
  #status {
    font-size: 11px;
    color: #aaa;
    width: 100%;
    line-height: 1.3;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #111;
  }
  #hud {
    position: absolute;
    left: 10px;
    top: 100px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    z-index: 15;
    min-width: 140px;
  }
  #hud b { color: #7ab8ff; }
  #streetName {
    color: #f0e6c8;
    font-weight: 600;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Mini-carte */
  #minimap {
    position: absolute;
    right: 10px;
    top: 100px;
    width: 120px;
    height: 120px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(10,14,22,0.85);
    z-index: 20;
    overflow: hidden;
    pointer-events: none;
  }
  #minimap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #touchControls {
    position: absolute;
    inset: 0;
    z-index: 25;
    pointer-events: none;
  }
  .pad {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 120px;
    height: 120px;
    pointer-events: auto;
    touch-action: none;
  }
  #steerPad { left: 14px; }
  #actionPad { right: 14px; }
  .pad-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.2);
  }
  .btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    transition: background 0.07s, transform 0.07s;
  }
  .btn.active {
    background: rgba(42,109,244,0.8);
    border-color: rgba(120,170,255,0.95);
  }
  #btnLeft  { left: 5px;  top: 50%; transform: translateY(-50%); width: 48px; height: 48px; }
  #btnRight { right: 5px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; }
  #btnLeft.active, #btnRight.active { transform: translateY(-50%) scale(0.93); }
  #btnAccel { top: 6px;  left: 50%; transform: translateX(-50%); width: 54px; height: 54px; }
  #btnBrake { bottom: 6px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; }
  #btnAccel.active, #btnBrake.active { transform: translateX(-50%) scale(0.93); }

  #btnReset, #btnMute, #btnView {
    position: absolute;
    bottom: max(155px, calc(env(safe-area-inset-bottom) + 140px));
    right: 18px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.25);
    color: #ccc;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    z-index: 26;
  }
  #btnReset.active { background: rgba(231,76,60,0.75); color: #fff; }
  #btnMute { bottom: max(207px, calc(env(safe-area-inset-bottom) + 192px)); font-size: 18px; }
  #btnView { bottom: max(259px, calc(env(safe-area-inset-bottom) + 244px)); font-size: 15px; font-weight: 700; }
  #tiltCtl {
    position: absolute;
    right: 66px;
    bottom: max(259px, calc(env(safe-area-inset-bottom) + 244px));
    display: none;
    align-items: center;
    gap: 4px;
    z-index: 26;
    pointer-events: auto;
  }
  #tiltCtl.show { display: flex; }
  #tiltCtl .tbtn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
    color: #ccc; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  #tiltCtl .tbtn:active { background: rgba(42,109,244,0.75); color: #fff; }
  #tiltLbl {
    min-width: 46px; text-align: center; color: #ccc;
    font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,0.5); padding: 6px 4px; border-radius: 8px;
  }

  .error { color: #ff6b6b !important; }
  .ok { color: #6bff9a !important; }

  #loadModal {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(8, 8, 14, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #loadModal.visible { display: flex; }
  .modal-box {
    background: #16161f;
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    padding: 22px 24px 20px;
    width: min(320px, 88vw);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #eee; }
  .modal-step { font-size: 12px; color: #9aa; margin-bottom: 14px; min-height: 1.2em; }
  .progress-track { height: 8px; background: #252532; border-radius: 6px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2a6df4, #5b9bff);
    border-radius: 6px;
    transition: width 0.35s ease;
  }
  .progress-pct { margin-top: 10px; font-size: 12px; color: #7ab8ff; text-align: right; }
  #radarLegend {
    position: absolute; right: 10px; top: 226px; z-index: 20;
    max-width: min(250px, 70vw); padding: 6px 9px; border-radius: 7px;
    background: rgba(0,0,0,.72); color: #ffd5d5; font-size: 11px;
    line-height: 1.3; pointer-events: none; display: none;
  }
  #radarLegend.visible { display: block; }
  #radarAttribution {
    position: absolute; right: 6px; bottom: 25px; z-index: 18;
    font: 10px system-ui; color: #fff; background: rgba(0,0,0,.65);
    padding: 3px 5px; border-radius: 4px; text-decoration: underline; display: none;
  }
  #radarAttribution.visible { display: block; }
</style>
</head>
<body>

<div id="ui">
  <span style="font-weight:800;letter-spacing:.08em;color:#7ab8ff;font-size:14px;white-space:nowrap">HAPPY TAXI</span>
  <input type="text" id="cityInput" placeholder="Ville (Olonne-sur-Mer, Annecy...)" value="Olonne-sur-Mer" enterkeyhint="search">
  <button id="loadBtn">Charger</button>
  <button id="gpsBtn" type="button" title="Charger la carte autour de ma position GPS">Ma position</button>
  <select id="mapLayerSelect" aria-label="Choisir un fond de carte">
    <option value="imagery">Imagerie actuelle</option>
    <option value="geology">Géologie (monde)</option>
    <option value="etatmajor">État-Major (1820–1866, France)</option>
    <option value="cassini">Cassini (XVIIIe–XIXe, France)</option>
    <option value="radars">Radars fixes (OpenStreetMap)</option>
  </select>
  <label id="gpsFollowLabel"><input id="gpsFollow" type="checkbox"> Suivi GPS continu</label>
  <span id="status">Prêt. Recherche une ville pour commencer.</span>
</div>

<div id="loadModal">
  <div class="modal-box">
    <div class="modal-title">Chargement de la carte</div>
    <div class="modal-step" id="modalStep">Initialisation…</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div id="hud">
  <div><b>Vitesse</b> : <span id="speed">0</span> km/h</div>
  <div><b>Rue</b> : <span id="streetName">—</span></div>
  <div id="infoRoutes">Routes : 0 · Bâtiments : 0</div>
</div>

<div id="minimap"><canvas id="minimapCanvas"></canvas></div>
<div id="radarLegend"></div>
<a id="mapAttribution" href="https://www.esri.com/en-us/legal/terms/full-master-agreement" target="_blank" rel="noopener noreferrer" style="position:absolute;right:6px;bottom:5px;z-index:18;font:10px system-ui;color:#fff;background:rgba(0,0,0,.65);padding:3px 5px;border-radius:4px;text-decoration:underline">Imagerie © Esri, Maxar, Earthstar Geographics</a>
<a id="radarAttribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">Données radars © contributeurs OpenStreetMap</a>

<div id="touchControls">
  <div class="pad" id="steerPad">
    <div class="pad-bg"></div>
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="pad" id="actionPad">
    <div class="pad-bg"></div>
    <div class="btn" id="btnAccel">▲</div>
    <div class="btn" id="btnBrake">▼</div>
  </div>
</div>
<div id="btnReset">R</div>
<div id="btnMute" title="Son (M)">🔊</div>
<div id="btnView" title="Vue (V)">N</div>
<div id="tiltCtl"><div class="tbtn" id="tiltDown">−</div><div id="tiltLbl">45°</div><div class="tbtn" id="tiltUp">+</div></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const speedEl = document.getElementById('speed');
const streetNameEl = document.getElementById('streetName');
const infoRoutesEl = document.getElementById('infoRoutes');
const loadBtn = document.getElementById('loadBtn');
const gpsBtn = document.getElementById('gpsBtn');
const gpsFollow = document.getElementById('gpsFollow');
const mapLayerSelect = document.getElementById('mapLayerSelect');
const mapAttribution = document.getElementById('mapAttribution');
const radarLegend = document.getElementById('radarLegend');
const radarAttribution = document.getElementById('radarAttribution');
const cityInput = document.getElementById('cityInput');
const loadModal = document.getElementById('loadModal');
const modalStep = document.getElementById('modalStep');
const progressFill = document.getElementById('progressFill');
const progressPct = document.getElementById('progressPct');
let gpsWatchId = null;
let lastGpsFix = null;
let gpsMapLoading = false;

function setProgress(pct, stepText) {
  const p = Math.max(0, Math.min(100, pct));
  progressFill.style.width = p + '%';
  progressPct.textContent = Math.round(p) + '%';
  if (stepText) modalStep.textContent = stepText;
}
function showModal() { loadModal.classList.add('visible'); setProgress(0, 'Initialisation…'); }
function hideModal() { loadModal.classList.remove('visible'); }

let viewW = 0, viewH = 0;
// ---------- Modes de vue : N (nord en haut), ↑ (cap de la voiture), 3D (incliné 45°) ----------
const VIEW_MODES = ['north', 'heading', 'tilt'];
const VIEW_LABELS = { north: 'N', heading: '↑', tilt: '3D' };
const TILT_MIN = 25, TILT_MAX = 85, TILT_STEP = 5;
// Compression verticale du sol en mode 3D : sinus de l'angle d'élévation (90° = vue du dessus)
function tiltK() { return Math.sin(state.tiltDeg * Math.PI / 180); }
let viewM = [1, 0, 0, 1];
let dprCur = 1;

function updateViewMatrix() {
  const A = state.car.angle;
  const c = Math.cos(A), s = Math.sin(A);
  if (state.viewMode === 'north') viewM = [1, 0, 0, 1];
  else if (state.viewMode === 'heading') viewM = [c, s, -s, c];
  else viewM = [c, s, -s * tiltK(), c * tiltK()];
}

// Monde -> écran (coordonnées en pixels CSS)
function toScreen(x, y) {
  const z = state.camera.zoom, m = viewM;
  const dx = x - state.camera.x, dy = y - state.camera.y;
  return {
    x: viewW / 2 + z * (m[0] * dx + m[1] * dy),
    y: viewH / 2 + z * (m[2] * dx + m[3] * dy)
  };
}

// Angle à l'écran d'un objet orienté dans le monde (sprite : avant = haut)
function screenAngle(a) {
  const fx = Math.sin(a), fy = -Math.cos(a), m = viewM;
  const sx = m[0] * fx + m[1] * fy;
  const sy = m[2] * fx + m[3] * fy;
  return Math.atan2(sx, -sy);
}

// Transformation du canvas : les couches de carte se dessinent directement en coordonnées monde
function applyMapTransform() {
  const z = state.camera.zoom, m = viewM;
  const cx = state.camera.x, cy = state.camera.y;
  ctx.setTransform(
    dprCur * z * m[0], dprCur * z * m[2],
    dprCur * z * m[1], dprCur * z * m[3],
    dprCur * (viewW / 2 - z * (m[0] * cx + m[1] * cy)),
    dprCur * (viewH / 2 - z * (m[2] * cx + m[3] * cy))
  );
}

function adjustTilt(delta) {
  state.tiltDeg = Math.max(TILT_MIN, Math.min(TILT_MAX, state.tiltDeg + delta));
  tiltLbl.textContent = state.tiltDeg + '°';
}

function updateTiltControl() {
  tiltCtl.classList.toggle('show', state.viewMode === 'tilt');
}

function cycleView() {
  const i = VIEW_MODES.indexOf(state.viewMode);
  state.viewMode = VIEW_MODES[(i + 1) % VIEW_MODES.length];
  btnView.textContent = VIEW_LABELS[state.viewMode];
  updateTiltControl();
}

function resize() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  canvas.width = viewW * dpr;
  canvas.height = viewH * dpr;
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  dprCur = dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // minimap
  const mm = 120;
  mmCanvas.width = mm * dpr;
  mmCanvas.height = mm * dpr;
  mmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

const state = {
  roads: [],
  segments: [],
  buildings: [],
  car: { x: 0, y: 0, angle: 0, speed: 0, maxSpeed: 5.6, accel: 0.11, friction: 0.98, turnSpeed: 0.095 },
  police: [],
  camera: { x: 0, y: 0, zoom: 2.2, targetZoom: 2.2, userZoomMul: 1 },
  keys: {},
  touch: { left: false, right: false, accel: false, brake: false },
  loaded: false,
  centerLat: 0,
  centerLon: 0,
  roadCanvas: null,
  roadOriginX: 0,
  roadOriginY: 0,
  roadScale: 1,
  buildingCanvas: null,
  buildOriginX: 0,
  buildOriginY: 0,
  buildScale: 1,
  tiles: new Map(),
  tileZoom: 18,
  tileLayer: 'imagery',
  radarLayer: false,
  radarCameras: [],
  radarQueryCenter: null,
  radarLoading: false,
  radarRequestId: 0,
  radarLastAttempt: 0,
  loadingTiles: new Set(),
  currentStreet: '—',
  wanted: false,
  catchTimer: 0,
  closeTimer: 0,
  gameOver: false,
  basemap: 'imagery',
  viewMode: 'north',
  tiltDeg: 45,
  usingFallbackMap: false
};

function latLonToLocal(lat, lon) {
  const R = 6371000;
  const dLat = (lat - state.centerLat) * Math.PI / 180;
  const dLon = (lon - state.centerLon) * Math.PI / 180;
  return {
    x: dLon * Math.cos(state.centerLat * Math.PI / 180) * R,
    y: -dLat * R
  };
}
function localToLatLon(x, y) {
  const R = 6371000;
  const lat = state.centerLat - (y / R) * (180 / Math.PI);
  const lon = state.centerLon + (x / (R * Math.cos(state.centerLat * Math.PI / 180))) * (180 / Math.PI);
  return { lat, lon };
}

function lon2tile(lon, z) { return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
function lat2tile(lat, z) {
  return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
}
function tile2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
function tile2lat(y, z) {
  const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}
function getTileUrl(z, x, y) {
  if (state.tileLayer === 'geology') {
    return 'https://tiles.macrostrat.org/carto/' + z + '/' + x + '/' + y + '.png';
  }
  if (state.tileLayer === 'etatmajor' || state.tileLayer === 'cassini') {
    const layer = state.tileLayer === 'etatmajor'
      ? 'GEOGRAPHICALGRIDSYSTEMS.ETATMAJOR40'
      : 'BNF-IGNF_GEOGRAPHICALGRIDSYSTEMS.CASSINI';
    return 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + layer +
      '&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX=' + z + '&TILEROW=' + y + '&TILECOL=' + x;
  }
  // Imagerie satellite Esri World Imagery (ordre des tuiles : z/y/x).
  return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x;
}
function requestTile(z, x, y) {
  const key = state.tileLayer + '/' + z + '/' + x + '/' + y;
  if (state.tiles.has(key) || state.loadingTiles.has(key)) return;
  state.loadingTiles.add(key);
  const img = new Image();
  img.onload = function() { state.tiles.set(key, img); state.loadingTiles.delete(key); };
  img.onerror = function() { state.loadingTiles.delete(key); };
  img.src = getTileUrl(z, x, y);
}

function drawSatellite() {
  const z = state.tileZoom;
  const k = state.viewMode === 'tilt' ? tiltK() : 1;
  const R = Math.hypot(viewW, viewH) / (2 * state.camera.zoom * k) + 40;
  const cx = state.camera.x, cy = state.camera.y;
  const corners = [
    localToLatLon(cx - R, cy - R),
    localToLatLon(cx + R, cy - R),
    localToLatLon(cx - R, cy + R),
    localToLatLon(cx + R, cy + R)
  ];
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  for (let i = 0; i < corners.length; i++) {
    const c = corners[i];
    if (c.lat < minLat) minLat = c.lat;
    if (c.lat > maxLat) maxLat = c.lat;
    if (c.lon < minLon) minLon = c.lon;
    if (c.lon > maxLon) maxLon = c.lon;
  }
  const pad = 0.001;
  minLat -= pad; maxLat += pad; minLon -= pad; maxLon += pad;
  const x0 = lon2tile(minLon, z), x1 = lon2tile(maxLon, z);
  const y0 = lat2tile(maxLat, z), y1 = lat2tile(minLat, z);
  for (let tx = x0; tx <= x1; tx++) {
    for (let ty = y0; ty <= y1; ty++) {
      requestTile(z, tx, ty);
      const img = state.tiles.get(state.tileLayer + '/' + z + '/' + tx + '/' + ty);
      if (!img) continue;
      const west = tile2lon(tx, z), east = tile2lon(tx + 1, z);
      const north = tile2lat(ty, z), south = tile2lat(ty + 1, z);
      const nw = latLonToLocal(north, west), se = latLonToLocal(south, east);
      ctx.drawImage(img, nw.x, nw.y, se.x - nw.x, se.y - nw.y);
    }
  }
}

const TILE_LAYER_INFO = {
  imagery: { href: 'https://www.esri.com/en-us/legal/terms/full-master-agreement', attribution: 'Imagerie © Esri, Maxar, Earthstar Geographics' },
  geology: { href: 'https://macrostrat.org/', attribution: 'Géologie © Macrostrat (CC BY 4.0)' },
  etatmajor: { href: 'https://remonterletemps.ign.fr/', attribution: 'Carte d’État-Major © IGN — 1820–1866' },
  cassini: { href: 'https://remonterletemps.ign.fr/', attribution: 'Carte de Cassini © IGN / BNF' }
};
function selectMapLayer(layer) {
  state.tileLayer = layer;
  state.tiles.clear();
  state.loadingTiles.clear();
  const info = TILE_LAYER_INFO[layer] || TILE_LAYER_INFO.imagery;
  mapAttribution.href = info.href;
  mapAttribution.textContent = info.attribution;
}
mapLayerSelect.addEventListener('change', function() {
  if (mapLayerSelect.value === 'radars') {
    state.radarLayer = true;
    radarLegend.classList.add('visible');
    radarAttribution.classList.add('visible');
    radarLegend.textContent = 'Recherche des radars fixes recensés dans OpenStreetMap…';
    if (state.loaded) refreshRadars(true);
  } else {
    state.radarLayer = false;
    state.radarRequestId++;
    state.radarLoading = false;
    radarLegend.classList.remove('visible');
    radarAttribution.classList.remove('visible');
    selectMapLayer(mapLayerSelect.value);
  }
});

// Requête réseau avec délai maximal : évite de laisser le chargement bloqué indéfiniment.
async function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(function() { controller.abort(); }, timeoutMs);
  try {
    const opts = Object.assign({}, options || {}, { signal: controller.signal });
    return await fetch(url, opts);
  } catch (err) {
    if (err && err.name === 'AbortError') throw new Error('Délai dépassé (' + Math.round(timeoutMs / 1000) + ' s)');
    if (location.protocol === 'file:') {
      throw new Error('Connexion bloquée depuis file://. Lance le jeu via un serveur local (ex. http://localhost:8000) ou publie-le sur GitHub Pages.');
    }
    // L'aperçu intégré de ChatGPT exécute la page dans un bac à sable qui
    // peut interdire les connexions vers les API OpenStreetMap (Nominatim,
    // Overpass et tuiles). Ce blocage ne peut pas être corrigé par un autre endpoint
    // depuis le JavaScript de cette page : il faut ouvrir la page hébergée.
    if (location.hostname.endsWith('oaiusercontent.com') || location.hostname.includes('web-sandbox')) {
      throw new Error('L’aperçu intégré ChatGPT bloque les connexions aux API OpenStreetMap (restriction réseau/CORS du bac à sable). Télécharge index.html puis ouvre-le depuis GitHub Pages ou un serveur local. Le jeu fonctionne depuis un navigateur classique avec accès Internet.');
    }
    throw new Error('Échec réseau/CORS vers ' + new URL(url).hostname + ' : ' + (err && err.message ? err.message : 'connexion impossible') + '. Vérifie la connexion ou réessaie depuis GitHub Pages / localhost.');
  } finally {
    clearTimeout(timer);
  }
}

// ---------- Cache local (localStorage) : évite de redemander les mêmes données ----------
const CACHE_PREFIX = 'happytaxi:v1:';
const CACHE_TTL_MS = 30 * 24 * 3600 * 1000; // 30 jours
function cacheGet(key) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (!entry || Date.now() - entry.t > CACHE_TTL_MS) {
      localStorage.removeItem(CACHE_PREFIX + key);
      return null;
    }
    return entry.d;
  } catch (e) { return null; }
}
function cacheSet(key, data) {
  try {
    localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), d: data }));
  } catch (e) {
    // Quota dépassé : on supprime la moitié des anciennes entrées puis on réessaie une fois.
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(CACHE_PREFIX)) keys.push(k);
      }
      keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => localStorage.removeItem(k));
      localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), d: data }));
    } catch (e2) { /* stockage indisponible : on continue sans cache */ }
  }
}

async function geocodeCity(name) {
  // Géocodage exclusivement OpenStreetMap via Nominatim.
  const geoKey = 'geo:' + name.trim().toLowerCase();
  const cachedPlace = cacheGet(geoKey);
  if (cachedPlace) return cachedPlace;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(name) + '&format=json&limit=1';
    const res = await fetchWithTimeout(url, { headers: { 'Accept': 'application/json' } }, 8000);
    if (!res.ok) throw new Error('Nominatim HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('Ville introuvable dans Nominatim');
    cacheSet(geoKey, data[0]);
    return data[0];
  } catch (err) {
    // Coordonnées fixes uniquement pour la ville proposée au démarrage :
    // les routes et bâtiments restent ensuite chargés depuis Overpass/OSM.
    if (/^olonne(?:-sur-mer)?$/i.test(name.trim())) {
      return { display_name: 'Olonne-sur-Mer, Vendée, France', boundingbox: [46.50, 46.57, -1.84, -1.72] };
    }
    throw new Error('Géocodage OSM impossible via Nominatim : ' + err.message);
  }
}

async function fetchOSM(bbox, onProgress) {
  const south = Number(bbox[0]), west = Number(bbox[1]);
  const north = Number(bbox[2]), east = Number(bbox[3]);
  if (![south, west, north, east].every(Number.isFinite) || south >= north || west >= east) {
    throw new Error('Emprise géographique invalide pour OpenStreetMap');
  }

  const query =
    '[out:json][timeout:20];' +
    'way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service)$"](' +
    south + ',' + west + ',' + north + ',' + east + ');' +
    'out geom;';

  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://lz4.overpass-api.de/api/interpreter',
    'https://overpass.openstreetmap.fr/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
  ];
  const body = new URLSearchParams({ data: query }).toString();
  const osmKey = 'osm:' + query;
  const cachedOsm = cacheGet(osmKey);
  if (cachedOsm) {
    if (onProgress) onProgress('Réseau routier chargé depuis le cache local');
    return cachedOsm;
  }
  if (onProgress) onProgress('Récupération du réseau routier (serveurs en parallèle)…');

  const attempts = endpoints.map(async function(endpoint) {
    const response = await fetchWithTimeout(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
        'Accept': 'application/json'
      },
      body
    }, 10000);
    if (!response.ok) throw new Error(new URL(endpoint).hostname + ' HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.elements)) throw new Error('Réponse Overpass invalide');
    if (!data.elements.some(el => el.type === 'way' && el.tags && el.tags.highway && Array.isArray(el.geometry))) {
      throw new Error('Aucune route trouvée dans cette zone');
    }
    return data;
  });

  try {
    // Le premier serveur qui répond correctement gagne.
    const result = await Promise.any(attempts);
    cacheSet(osmKey, result);
    return result;
  } catch (agg) {
    const msgs = (agg.errors || []).map(e => e.message).join(' | ');
    throw new Error('Les serveurs Overpass ne répondent pas. ' + msgs);
  }
}

async function fetchRadars(bbox) {
  const south = bbox[0], west = bbox[1], north = bbox[2], east = bbox[3];
  const query = '[out:json][timeout:15];node["highway"="speed_camera"](' +
    south + ',' + west + ',' + north + ',' + east + ');out body;';
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://overpass.openstreetmap.fr/api/interpreter'
  ];
  const body = new URLSearchParams({ data: query }).toString();
  const attempts = endpoints.map(async function(endpoint) {
    const response = await fetchWithTimeout(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8', 'Accept': 'application/json' },
      body
    }, 12000);
    if (!response.ok) throw new Error(new URL(endpoint).hostname + ' HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.elements)) throw new Error('Réponse Overpass invalide');
    return data.elements.filter(function(el) {
      return el.type === 'node' && el.tags && el.tags.highway === 'speed_camera' &&
        Number.isFinite(el.lat) && Number.isFinite(el.lon);
    });
  });
  try { return await Promise.any(attempts); }
  catch (agg) {
    const messages = (agg.errors || []).map(function(err) { return err.message; }).join(' | ');
    throw new Error('Les serveurs Overpass ne répondent pas. ' + messages);
  }
}

async function refreshRadars(force) {
  if (!state.loaded || !state.radarLayer || state.radarLoading) return;
  const now = Date.now();
  if (!force && now - state.radarLastAttempt < 30000) return;
  const center = localToLatLon(state.camera.x, state.camera.y);
  if (!force && state.radarQueryCenter) {
    const previous = latLonToLocal(state.radarQueryCenter.lat, state.radarQueryCenter.lon);
    if (Math.hypot(state.camera.x - previous.x, state.camera.y - previous.y) < 4500) return;
  }
  const halfLat = 0.045;
  const halfLon = halfLat / Math.max(0.2, Math.cos(center.lat * Math.PI / 180));
  const bounds = [center.lat - halfLat, center.lon - halfLon, center.lat + halfLat, center.lon + halfLon];
  const requestId = ++state.radarRequestId;
  state.radarLoading = true;
  state.radarLastAttempt = now;
  radarLegend.textContent = 'Recherche des radars fixes recensés dans OpenStreetMap…';
  try {
    const elements = await fetchRadars(bounds);
    if (requestId !== state.radarRequestId || !state.radarLayer) return;
    state.radarCameras = elements.map(function(el) {
      return {
        id: el.id,
        x: latLonToLocal(el.lat, el.lon).x,
        y: latLonToLocal(el.lat, el.lon).y,
        maxspeed: el.tags.maxspeed || ''
      };
    });
    state.radarQueryCenter = center;
    radarLegend.textContent = state.radarCameras.length + ' radar' + (state.radarCameras.length === 1 ? '' : 's') +
      ' fixe' + (state.radarCameras.length === 1 ? '' : 's') + ' recensé' + (state.radarCameras.length === 1 ? '' : 's') +
      ' · données OpenStreetMap';
  } catch (error) {
    if (requestId !== state.radarRequestId || !state.radarLayer) return;
    console.error(error);
    radarLegend.textContent = 'Données radars indisponibles pour le moment.';
  } finally {
    if (requestId === state.radarRequestId) state.radarLoading = false;
  }
}

function simplify(points, tolerance) {
  if (tolerance === undefined) tolerance = 2.2;
  if (points.length <= 4) return points;
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const prev = out[out.length - 1];
    const dx = points[i].x - prev.x, dy = points[i].y - prev.y;
    if (dx * dx + dy * dy > tolerance * tolerance) out.push(points[i]);
  }
  out.push(points[points.length - 1]);
  return out;
}

function roadHalfWidth(type) {
  if (type === 'motorway' || type === 'trunk') return 9;
  if (type === 'primary') return 7;
  if (type === 'secondary') return 6;
  if (type === 'tertiary') return 5;
  return 4.2;
}

function parseOSM(osmData) {
  const nodes = {};
  for (let i = 0; i < osmData.elements.length; i++) {
    const el = osmData.elements[i];
    if (el.type === 'node') nodes[el.id] = { lat: el.lat, lon: el.lon };
  }
  const roads = [];
  const buildings = [];

  for (let i = 0; i < osmData.elements.length; i++) {
    const el = osmData.elements[i];
    if (el.type !== 'way' || !el.tags) continue;

    const pts = [];
    if (Array.isArray(el.geometry)) {
      for (let j = 0; j < el.geometry.length; j++) {
        const n = el.geometry[j];
        if (Number.isFinite(n.lat) && Number.isFinite(n.lon)) pts.push(latLonToLocal(n.lat, n.lon));
      }
    } else if (Array.isArray(el.nodes)) {
      for (let j = 0; j < el.nodes.length; j++) {
        const n = nodes[el.nodes[j]];
        if (n) pts.push(latLonToLocal(n.lat, n.lon));
      }
    }
    if (pts.length < 2) continue;

    if (el.tags.highway) {
      roads.push({
        points: simplify(pts),
        type: el.tags.highway,
        halfW: roadHalfWidth(el.tags.highway),
        name: el.tags.name || el.tags['name:fr'] || null
      });
    } else if (el.tags.building) {
      // Polygone fermé
      let poly = pts;
      if (poly.length >= 3) {
        const first = poly[0], last = poly[poly.length - 1];
        if (first.x !== last.x || first.y !== last.y) poly = poly.concat([first]);
        // Hauteur : levels * 3m ou height
        let h = 8;
        if (el.tags['building:levels']) h = parseFloat(el.tags['building:levels']) * 3;
        else if (el.tags.height) h = parseFloat(String(el.tags.height).replace('m', '')) || 8;
        h = Math.min(80, Math.max(4, h));
        buildings.push({ points: simplify(poly, 1.5), height: h });
      }
    }
  }
  return { roads, buildings };
}

function buildSegments() {
  const segs = [];
  for (let r = 0; r < state.roads.length; r++) {
    const road = state.roads[r];
    const pts = road.points;
    for (let i = 0; i < pts.length - 1; i++) {
      segs.push({
        x1: pts[i].x, y1: pts[i].y,
        x2: pts[i + 1].x, y2: pts[i + 1].y,
        halfW: road.halfW,
        name: road.name
      });
    }
  }
  state.segments = segs;
}

function roadWidthVisual(type) {
  if (type === 'motorway' || type === 'trunk') return 11;
  if (type === 'primary') return 8;
  if (type === 'secondary') return 6.5;
  if (type === 'tertiary') return 5;
  return 3.8;
}
function roadColor(type) {
  if (type === 'motorway' || type === 'trunk') return 'rgba(255,210,120,0.95)';
  if (type === 'primary') return 'rgba(240,240,240,0.9)';
  if (type === 'secondary') return 'rgba(210,210,210,0.85)';
  return 'rgba(180,180,180,0.8)';
}

function bakeRoads() {
  if (!state.roads.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let r = 0; r < state.roads.length; r++) {
    const pts = state.roads[r].points;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
  }
  const pad = 40;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const worldW = maxX - minX, worldH = maxY - minY;
  const targetPx = Math.min(4096, Math.max(1200, Math.max(worldW, worldH) * 2.6));
  const scale = targetPx / Math.max(worldW, worldH);
  const off = document.createElement('canvas');
  off.width = Math.ceil(worldW * scale);
  off.height = Math.ceil(worldH * scale);
  const octx = off.getContext('2d');
  for (let r = 0; r < state.roads.length; r++) {
    const road = state.roads[r];
    if (road.points.length < 2) continue;
    octx.beginPath();
    octx.moveTo((road.points[0].x - minX) * scale, (road.points[0].y - minY) * scale);
    for (let i = 1; i < road.points.length; i++) {
      octx.lineTo((road.points[i].x - minX) * scale, (road.points[i].y - minY) * scale);
    }
    octx.strokeStyle = roadColor(road.type);
    octx.lineWidth = roadWidthVisual(road.type) * scale;
    octx.lineCap = 'round';
    octx.lineJoin = 'round';
    octx.stroke();
    // Liseré central pour plus de lisibilité
    octx.strokeStyle = 'rgba(255,255,255,0.25)';
    octx.lineWidth = Math.max(0.8, roadWidthVisual(road.type) * scale * 0.15);
    octx.stroke();
  }
  state.roadCanvas = off;
  state.roadOriginX = minX;
  state.roadOriginY = minY;
  state.roadScale = scale;
}

function bakeBuildings() {
  if (!state.buildings.length) {
    state.buildingCanvas = null;
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let b = 0; b < state.buildings.length; b++) {
    const pts = state.buildings[b].points;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
  }
  // Marge pour l'extrusion
  const maxH = 30;
  minX -= maxH; minY -= maxH; maxX += maxH; maxY += maxH;
  const worldW = maxX - minX, worldH = maxY - minY;
  const targetPx = Math.min(3600, Math.max(1000, Math.max(worldW, worldH) * 2.2));
  const scale = targetPx / Math.max(worldW, worldH);
  const off = document.createElement('canvas');
  off.width = Math.ceil(worldW * scale);
  off.height = Math.ceil(worldH * scale);
  const octx = off.getContext('2d');

  // Offset "soleil" pour faux 3D (vers haut-droite de l'écran = -y, +x en local)
  // En local y pointe vers le sud (car -dLat), donc nord = -y
  const sunX = 0.55;
  const sunY = -0.55;

  // Trier par "profondeur" (somme y pour un ordre approximatif)
  const sorted = state.buildings.slice().sort(function(a, b) {
    let ay = 0, by = 0;
    for (let i = 0; i < a.points.length; i++) ay += a.points[i].y;
    for (let i = 0; i < b.points.length; i++) by += b.points[i].y;
    return ay / a.points.length - by / b.points.length;
  });

  for (let bi = 0; bi < sorted.length; bi++) {
    const b = sorted[bi];
    const h = Math.min(28, b.height * 0.55); // facteur d'extrusion visuelle
    const ox = sunX * h;
    const oy = sunY * h;
    const pts = b.points;

    // Murs (faces)
    octx.fillStyle = 'rgba(45, 52, 68, 0.92)';
    octx.beginPath();
    for (let i = 0; i < pts.length - 1; i++) {
      const p1 = pts[i], p2 = pts[i + 1];
      octx.moveTo((p1.x - minX) * scale, (p1.y - minY) * scale);
      octx.lineTo((p2.x - minX) * scale, (p2.y - minY) * scale);
      octx.lineTo((p2.x + ox - minX) * scale, (p2.y + oy - minY) * scale);
      octx.lineTo((p1.x + ox - minX) * scale, (p1.y + oy - minY) * scale);
      octx.closePath();
    }
    octx.fill();

    // Toit
    octx.fillStyle = 'rgba(70, 82, 105, 0.95)';
    octx.beginPath();
    octx.moveTo((pts[0].x + ox - minX) * scale, (pts[0].y + oy - minY) * scale);
    for (let i = 1; i < pts.length; i++) {
      octx.lineTo((pts[i].x + ox - minX) * scale, (pts[i].y + oy - minY) * scale);
    }
    octx.closePath();
    octx.fill();

    // Contour toit léger
    octx.strokeStyle = 'rgba(20,24,32,0.5)';
    octx.lineWidth = 0.8;
    octx.stroke();
  }

  state.buildingCanvas = off;
  state.buildOriginX = minX;
  state.buildOriginY = minY;
  state.buildScale = scale;
}

function closestPointOnSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 < 0.0001) return { x: x1, y: y1, t: 0 };
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  return { x: x1 + t * dx, y: y1 + t * dy, t: t };
}

// ---------- Index spatial des segments (grille) : évite de tout parcourir à chaque image ----------
const GRID_CELL = 80;

function ensureSegGrid() {
  const segs = state.segments;
  if (state.grid && state.grid.src === segs) return state.grid;
  const map = new Map();
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const pad = (s.halfW || 6) + 2;
    const x0 = Math.floor((Math.min(s.x1, s.x2) - pad) / GRID_CELL);
    const x1 = Math.floor((Math.max(s.x1, s.x2) + pad) / GRID_CELL);
    const y0 = Math.floor((Math.min(s.y1, s.y2) - pad) / GRID_CELL);
    const y1 = Math.floor((Math.max(s.y1, s.y2) + pad) / GRID_CELL);
    for (let gx = x0; gx <= x1; gx++) {
      for (let gy = y0; gy <= y1; gy++) {
        const key = gx + ',' + gy;
        let list = map.get(key);
        if (!list) { list = []; map.set(key, list); }
        list.push(i);
      }
    }
  }
  state.grid = { src: segs, map: map, stamp: 0, seen: new Uint32Array(segs.length) };
  return state.grid;
}

function findNearestRoad(px, py) {
  const segs = state.segments;
  if (!segs.length) return null;
  const g = ensureSegGrid();
  const cx = Math.floor(px / GRID_CELL), cy = Math.floor(py / GRID_CELL);
  const stamp = ++g.stamp;
  let bestDist = Infinity, best = null;
  for (let k = 0; k <= 40; k++) {
    // Anneau de cases à distance k autour de la case du point
    for (let gx = cx - k; gx <= cx + k; gx++) {
      for (let gy = cy - k; gy <= cy + k; gy++) {
        if (Math.max(Math.abs(gx - cx), Math.abs(gy - cy)) !== k) continue;
        const list = g.map.get(gx + ',' + gy);
        if (!list) continue;
        for (let j = 0; j < list.length; j++) {
          const idx = list[j];
          if (g.seen[idx] === stamp) continue;
          g.seen[idx] = stamp;
          const s = segs[idx];
          const cp = closestPointOnSegment(px, py, s.x1, s.y1, s.x2, s.y2);
          const dx = px - cp.x, dy = py - cp.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestDist) {
            bestDist = d;
            best = { x: cp.x, y: cp.y, dist: d, halfW: s.halfW, name: s.name, seg: s };
          }
        }
      }
    }
    // Les cases suivantes sont forcément plus loin que k * GRID_CELL
    if (best && bestDist <= k * GRID_CELL) break;
  }
  return best || findNearestRoadBrute(px, py);
}

// Secours : parcours complet (utilisé seulement si la grille ne trouve rien)
function findNearestRoadBrute(px, py) {
  let bestDist = Infinity, best = null;
  const segs = state.segments;
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const cp = closestPointOnSegment(px, py, s.x1, s.y1, s.x2, s.y2);
    const dx = px - cp.x, dy = py - cp.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestDist) {
      bestDist = d;
      best = { x: cp.x, y: cp.y, dist: d, halfW: s.halfW, name: s.name, seg: s };
    }
  }
  return best;
}

function constrainEntity(ent) {
  const nearest = findNearestRoad(ent.x, ent.y);
  if (!nearest) return nearest;
  const maxDist = nearest.halfW * 0.92;
  if (nearest.dist > maxDist) {
    const nx = (ent.x - nearest.x) / (nearest.dist || 1);
    const ny = (ent.y - nearest.y) / (nearest.dist || 1);
    ent.x = nearest.x + nx * maxDist;
    ent.y = nearest.y + ny * maxDist;
    ent.speed *= 0.93;
  }
  return nearest;
}

function constrainToRoad() {
  const nearest = constrainEntity(state.car);
  if (!nearest) return;
  if (nearest.name) state.currentStreet = nearest.name;
  else if (nearest.dist < nearest.halfW * 1.5) state.currentStreet = 'Rue sans nom';
}

function randomRoadPoint() {
  if (!state.segments.length) return { x: 0, y: 0, angle: 0 };
  const s = state.segments[Math.floor(Math.random() * state.segments.length)];
  const t = 0.2 + Math.random() * 0.6;
  const x = s.x1 + (s.x2 - s.x1) * t;
  const y = s.y1 + (s.y2 - s.y1) * t;
  const angle = Math.atan2(s.x2 - s.x1, -(s.y2 - s.y1));
  return { x, y, angle };
}

// ---------- Effectifs de police ----------
const POLICE_START = 9;      // voitures au début d'une partie
const POLICE_MAX = 14;       // plafond pendant une poursuite
const POLICE_AMBIENT = 9;    // effectif visé quand personne ne te poursuit
const AMBIENT_DELAY = 10;    // secondes entre deux apparitions calmes
const REINFORCE_DELAY = 8;   // secondes de poursuite avant un renfort

function makePolice(pt, wp) {
  return {
    x: pt.x,
    y: pt.y,
    angle: pt.angle,
    speed: 0.8,
    maxSpeed: 1.25,
    patrolSpeed: 1.15 + Math.random() * 0.15,
    chaseSpeed: 2.2 + Math.random() * 0.25,
    accel: 0.075,
    friction: 0.97,
    turnSpeed: 0.058,
    sirenPhase: Math.random() * Math.PI * 2,
    mode: 'patrol',
    targetX: wp.x,
    targetY: wp.y,
    viewRange: 130,
    loseRange: 170,
    sightCone: 0.72
  };
}

// Point de route aléatoire loin du joueur (pour les renforts).
function pointBetween(minD, maxD) {
  for (let t = 0; t < 80; t++) {
    const c = randomRoadPoint();
    const d = Math.hypot(c.x - state.car.x, c.y - state.car.y);
    if (d > minD && d < maxD) return c;
  }
  return null;
}

function farRoadPoint(minDist) {
  for (let t = 0; t < 60; t++) {
    const c = randomRoadPoint();
    if (Math.hypot(c.x - state.car.x, c.y - state.car.y) > minDist) return c;
  }
  return null;
}

function spawnPolice(count) {
  state.police = [];
  const player = state.car;
  const placed = [];

  function farEnough(pt) {
    if (Math.hypot(pt.x - player.x, pt.y - player.y) < 100) return false;
    for (let k = 0; k < placed.length; k++) {
      if (Math.hypot(pt.x - placed[k].x, pt.y - placed[k].y) < 140) return false;
    }
    return true;
  }

  for (let i = 0; i < count; i++) {
    let pt = null;
    for (let tries = 0; tries < 80; tries++) {
      const cand = randomRoadPoint();
      if (farEnough(cand)) { pt = cand; break; }
    }
    if (!pt) {
      const segs = state.segments;
      let best = null, bestScore = -1;
      for (let s = 0; s < segs.length; s++) {
        const midX = (segs[s].x1 + segs[s].x2) / 2;
        const midY = (segs[s].y1 + segs[s].y2) / 2;
        let score = Math.hypot(midX - player.x, midY - player.y);
        for (let k = 0; k < placed.length; k++) {
          score += Math.hypot(midX - placed[k].x, midY - placed[k].y) * 0.5;
        }
        if (score > bestScore) {
          bestScore = score;
          best = {
            x: midX,
            y: midY,
            angle: Math.atan2(segs[s].x2 - segs[s].x1, -(segs[s].y2 - segs[s].y1))
          };
        }
      }
      pt = best || randomRoadPoint();
    }
    placed.push(pt);

    let wp = randomRoadPoint();
    for (let t2 = 0; t2 < 25; t2++) {
      const c = randomRoadPoint();
      if (Math.hypot(c.x - pt.x, c.y - pt.y) > 90) { wp = c; break; }
    }

    state.police.push(makePolice(pt, wp));
  }
  state.wanted = false;
  state.reinforceTimer = 0;
  state.ambientTimer = 0;
  state.catchTimer = 0;
  state.closeTimer = 0;
  state.gameOver = false;
}

function policeRoadAssist(p) {
  const nearest = findNearestRoad(p.x, p.y);
  if (!nearest) return;

  const bestSeg = nearest.seg;
  if (!bestSeg) return;

  let roadAngle = Math.atan2(bestSeg.x2 - bestSeg.x1, -(bestSeg.y2 - bestSeg.y1));
  let diff = roadAngle - p.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  let diffFlip = diff + (diff > 0 ? -Math.PI : Math.PI);
  if (Math.abs(diffFlip) < Math.abs(diff)) {
    roadAngle += Math.PI;
    diff = diffFlip;
  }

  // Alignement fort sur la chaussée
  p.angle += Math.max(-0.12, Math.min(0.12, diff * 0.28));

  const dx = nearest.x - p.x;
  const dy = nearest.y - p.y;
  const off = Math.hypot(dx, dy);
  if (off > 0.5) {
    const pull = Math.min(0.45, off * 0.35);
    p.x += dx / off * pull;
    p.y += dy / off * pull;
  }
  // Si trop hors route, snap plus sec
  if (off > nearest.halfW * 0.9) {
    p.x = nearest.x + (p.x - nearest.x) * 0.15;
    p.y = nearest.y + (p.y - nearest.y) * 0.15;
    p.speed *= 0.95;
  }
}

function canSeePlayer(p, player) {
  const dx = player.x - p.x;
  const dy = player.y - p.y;
  const dist = Math.hypot(dx, dy);
  if (dist > p.viewRange) return false;
  // Angle vers le joueur vs orientation police
  const toPlayer = Math.atan2(dx, -dy);
  let diff = toPlayer - p.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  // Dans le cône de vision OU très proche (angle mort court)
  if (dist < 28) return true;
  return Math.cos(diff) >= p.sightCone;
}

function steerToward(p, tx, ty, aggressiveness) {
  const dx = tx - p.x;
  const dy = ty - p.y;
  const dist = Math.hypot(dx, dy) || 1;
  const targetAngle = Math.atan2(dx, -dy);
  let diff = targetAngle - p.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const turn = Math.max(-p.turnSpeed, Math.min(p.turnSpeed, diff));
  p.angle += turn * Math.min(1, Math.abs(p.speed) / 1.2 + 0.35) * aggressiveness;
  const facing = Math.cos(diff);
  if (facing > 0.15) p.speed += p.accel * (0.45 + facing * 0.55);
  else if (facing < -0.25) { p.speed *= 0.88; p.speed -= p.accel * 0.25; }
  else p.speed += p.accel * 0.25;
  return dist;
}

// Une police immobile pendant 2 s est replacée sur une autre route, loin du joueur.
function respawnStuckPolice(p) {
  const pt = farRoadPoint(150);
  if (!pt) return;
  const wp = randomRoadPoint();
  p.x = pt.x; p.y = pt.y; p.angle = pt.angle;
  p.speed = 0.8;
  p.mode = 'patrol';
  p.targetX = wp.x; p.targetY = wp.y;
}

function updatePolice() {
  const player = state.car;
  let anyChasing = false;

  for (let i = 0; i < state.police.length; i++) {
    const p = state.police[i];
    const dist = Math.hypot(player.x - p.x, player.y - p.y);

    // Contrôle de blocage toutes les 2 secondes
    p.frames = (p.frames || 0) + 1;
    p.age = (p.age || 0) + 1;
    if (p.frames % 120 === 0) {
      if (p.snapX !== undefined) {
        const moved = Math.hypot(p.x - p.snapX, p.y - p.snapY);
        if (moved < 15) {
          const away = Math.hypot(p.x - player.x, p.y - player.y);
          if (away > 220) {
            respawnStuckPolice(p);   // hors de vue : réapparition invisible
          } else {
            const wp = randomRoadPoint();   // sous les yeux du joueur : on relance sans téléporter
            p.targetX = wp.x; p.targetY = wp.y;
            p.speed = 0.8;
          }
        }
      }
      p.snapX = p.x;
      p.snapY = p.y;
    }

    // Détection / perte de vue
    if (p.mode === 'patrol') {
      if (canSeePlayer(p, player)) {
        p.mode = 'chase';
        playSfx('alert');
      }
    } else {
      // Poursuite : perd la trace si trop loin
      if (dist > p.loseRange) {
        p.mode = 'patrol';
        const wp = randomRoadPoint();
        p.targetX = wp.x;
        p.targetY = wp.y;
      }
    }

    if (p.mode === 'chase') {
      anyChasing = true;
      p.sirenPhase += 0.22;
      p.maxSpeed = p.chaseSpeed;
      // Anticipation légère
      let tx = player.x, ty = player.y;
      if (Math.abs(player.speed) > 1.2) {
        const look = player.speed * 6;
        tx += Math.sin(player.angle) * look;
        ty -= Math.cos(player.angle) * look;
      }
      steerToward(p, tx, ty, 1.0);
    } else {
      // Patrouille aléatoire vers un waypoint sur la route
      p.sirenPhase += 0.04;
      p.maxSpeed = p.patrolSpeed;
      // Vise un point encore sur la route, pas trop loin
      const dWp = steerToward(p, p.targetX, p.targetY, 0.7);
      if (dWp < 20) {
        // Nouveau waypoint : segment un peu plus loin dans une direction aléatoire
        let wp = null;
        for (let t2 = 0; t2 < 40; t2++) {
          const c = randomRoadPoint();
          const dd = Math.hypot(c.x - p.x, c.y - p.y);
          const dp = Math.hypot(c.x - player.x, c.y - player.y);
          if (dd > 60 && dd < 220 && dp < 400) { wp = c; break; }
        }
        if (!wp) wp = randomRoadPoint();
        p.targetX = wp.x;
        p.targetY = wp.y;
      }
    }

    p.speed *= p.friction;
    if (Math.abs(p.speed) < 0.02) p.speed = 0;
    p.speed = Math.max(-1.2, Math.min(p.maxSpeed, p.speed));

    p.x += Math.sin(p.angle) * p.speed;
    p.y -= Math.cos(p.angle) * p.speed;
    policeRoadAssist(p);
    constrainEntity(p);
  }

  state.wanted = anyChasing;

  // Renforts : pendant la poursuite, une nouvelle voiture arrive toutes les X secondes
  if (anyChasing && state.police.length < POLICE_MAX) {
    state.reinforceTimer = (state.reinforceTimer || 0) + 1 / 60;
    if (state.reinforceTimer >= REINFORCE_DELAY) {
      state.reinforceTimer = 0;
      const pt = farRoadPoint(180);
      if (pt) {
        state.police.push(makePolice(pt, randomRoadPoint()));
        playSfx('reinforce');
      }
    }
  } else if (!anyChasing) {
    state.reinforceTimer = 0;
  }

  // Apparitions calmes : hors poursuite, de nouvelles patrouilles arrivent près de toi
  if (!anyChasing && state.police.length < POLICE_AMBIENT) {
    state.ambientTimer = (state.ambientTimer || 0) + 1 / 60;
    if (state.ambientTimer >= AMBIENT_DELAY) {
      state.ambientTimer = 0;
      const pt = pointBetween(150, 400);
      if (pt) state.police.push(makePolice(pt, randomRoadPoint()));
    }
  }

  resolveVehicleCollisions();

  // Game over seulement si une police en poursuite reste collée 10s
  let anyClose = false;
  for (let i = 0; i < state.police.length; i++) {
    const p = state.police[i];
    if (p.mode !== 'chase') continue;
    const d = Math.hypot(player.x - p.x, player.y - p.y);
    if (d < 24) { anyClose = true; break; }
  }
  if (anyClose) {
    state.closeTimer += 1 / 60;
  } else {
    state.closeTimer = Math.max(0, state.closeTimer - 1.5 / 60);
  }
  if (state.closeTimer >= 10) {
    state.gameOver = true;
    state.closeTimer = 10;
    playSfx('gameover');
  }
}

function separateCars(a, b, minDist) {
  let dx = b.x - a.x;
  let dy = b.y - a.y;
  let dist = Math.hypot(dx, dy);
  if (dist < 0.001) {
    // Positions identiques : pousse dans une direction arbitraire
    dx = Math.cos(a.angle + Math.PI / 2);
    dy = Math.sin(a.angle + Math.PI / 2);
    dist = 0.001;
  }
  if (dist >= minDist) return false;

  const nx = dx / dist;
  const ny = dy / dist;
  const overlap = minDist - dist;

  // Séparation ferme (moitié chacun)
  a.x -= nx * overlap * 0.55;
  a.y -= ny * overlap * 0.55;
  b.x += nx * overlap * 0.45;
  b.y += ny * overlap * 0.45;

  // Annule la vitesse relative le long de la normale de contact
  const avx = Math.sin(a.angle) * a.speed;
  const avy = -Math.cos(a.angle) * a.speed;
  const bvx = Math.sin(b.angle) * b.speed;
  const bvy = -Math.cos(b.angle) * b.speed;
  const rel = (avx - bvx) * nx + (avy - bvy) * ny;
  if (rel > 0) {
    // Ils se rapprochent encore → amortir
    a.speed *= 0.7;
    b.speed *= 0.65;
  } else {
    a.speed *= 0.88;
    b.speed *= 0.88;
  }

  // Petit rebond latéral
  a.speed *= 0.92;
  b.speed *= 0.9;
  return true;
}

function resolveVehicleCollisions() {
  const player = state.car;
  const minDist = 16; // rayon de collision voiture

  // 3 passes pour éviter de rester coincés l'un dans l'autre
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < state.police.length; i++) {
      if (separateCars(player, state.police[i], minDist)) {
        constrainEntity(player);
        constrainEntity(state.police[i]);
      }
      // Police ↔ police
      for (let j = i + 1; j < state.police.length; j++) {
        if (separateCars(state.police[i], state.police[j], minDist)) {
          constrainEntity(state.police[i]);
          constrainEntity(state.police[j]);
        }
      }
    }
  }
}

// ---------- Sons (synthétisés avec Web Audio, aucun fichier) ----------
const audio = {
  ctx: null, master: null, muted: false, noise: null,
  engineOsc: null, engineFilter: null, engineGain: null,
  sirenOsc: null, sirenGain: null, sirenNext: 0, sirenHigh: false,
  prevSpeed: 0, skidCooldown: 0
};

function audioInit() {
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  audio.ctx = ctx;
  audio.master = ctx.createGain();
  audio.master.gain.value = audio.muted ? 0 : 0.5;
  audio.master.connect(ctx.destination);

  // Moteur : sawtooth filtré, grave au ralenti, plus aigu à vitesse élevée
  audio.engineOsc = ctx.createOscillator();
  audio.engineOsc.type = 'sawtooth';
  audio.engineOsc.frequency.value = 38;
  audio.engineFilter = ctx.createBiquadFilter();
  audio.engineFilter.type = 'lowpass';
  audio.engineFilter.frequency.value = 380;
  audio.engineGain = ctx.createGain();
  audio.engineGain.gain.value = 0.035;
  audio.engineOsc.connect(audio.engineFilter);
  audio.engineFilter.connect(audio.engineGain);
  audio.engineGain.connect(audio.master);
  audio.engineOsc.start();

  // Sirène : triangle à deux tons, active pendant la poursuite
  audio.sirenOsc = ctx.createOscillator();
  audio.sirenOsc.type = 'triangle';
  audio.sirenOsc.frequency.value = 620;
  audio.sirenGain = ctx.createGain();
  audio.sirenGain.gain.value = 0;
  audio.sirenOsc.connect(audio.sirenGain);
  audio.sirenGain.connect(audio.master);
  audio.sirenOsc.start();
}

function noiseBuffer() {
  if (audio.noise) return audio.noise;
  const len = audio.ctx.sampleRate;
  const buf = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  audio.noise = buf;
  return buf;
}

function playNoise(dur, freq, gain, q) {
  const ctx = audio.ctx;
  const t = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer();
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = freq;
  f.Q.value = q || 1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(audio.master);
  src.start(t); src.stop(t + dur);
}

function playTone(freq, dur, type, gain, endFreq, delay) {
  const ctx = audio.ctx;
  const t = ctx.currentTime + (delay || 0);
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audio.master);
  o.start(t); o.stop(t + dur + 0.02);
}

function playSfx(name) {
  if (!audio.ctx || audio.muted || audio.ctx.state !== 'running') return;
  switch (name) {
    case 'alert':     // bip d'alerte : une voiture vous repère
      playTone(880, 0.12, 'square', 0.06);
      playTone(660, 0.14, 'square', 0.06, null, 0.14);
      break;
    case 'reinforce': // renfort qui arrive
      playTone(520, 0.2, 'sawtooth', 0.05, 780);
      playTone(780, 0.25, 'sawtooth', 0.05, 520, 0.22);
      break;
    case 'crash':     // choc avec une voiture de police
      playNoise(0.35, 220, 0.6, 0.8);
      playTone(90, 0.3, 'sine', 0.4, 40);
      break;
    case 'skid':      // crissement de pneus
      playNoise(0.3, 2200, 0.15, 3);
      break;
    case 'gameover':  // descente sinistre
      playTone(440, 0.35, 'sawtooth', 0.09, 220);
      playTone(330, 0.35, 'sawtooth', 0.09, 165, 0.35);
      playTone(220, 0.8, 'sawtooth', 0.09, 110, 0.7);
      break;
  }
}

function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.master) {
    audio.master.gain.setTargetAtTime(audio.muted ? 0 : 0.5, audio.ctx.currentTime, 0.05);
  }
  btnMute.textContent = audio.muted ? '🔇' : '🔊';
}

// Appelé à chaque image : moteur, sirène, chocs et dérapages.
function updateSound() {
  if (!audio.ctx || audio.ctx.state !== 'running') return;
  const t = audio.ctx.currentTime;
  const car = state.car;
  const spd = Math.abs(car.speed);

  audio.engineOsc.frequency.setTargetAtTime(38 + spd * 46, t, 0.08);
  audio.engineFilter.frequency.setTargetAtTime(380 + spd * 260, t, 0.1);
  audio.engineGain.gain.setTargetAtTime(0.035 + spd * 0.012, t, 0.1);

  // Sirène : plus forte quand la police est proche
  let nearest = Infinity, chasing = false;
  for (let i = 0; i < state.police.length; i++) {
    const p = state.police[i];
    if (p.mode !== 'chase') continue;
    chasing = true;
    nearest = Math.min(nearest, Math.hypot(p.x - car.x, p.y - car.y));
  }
  let sirenVol = 0;
  if (chasing && !state.gameOver) {
    sirenVol = 0.07 * Math.max(0.15, 1 - nearest / 450);
  }
  audio.sirenGain.gain.setTargetAtTime(sirenVol, t, 0.1);
  if (chasing && t >= audio.sirenNext) {
    audio.sirenHigh = !audio.sirenHigh;
    audio.sirenOsc.frequency.setTargetAtTime(audio.sirenHigh ? 960 : 620, t, 0.03);
    audio.sirenNext = t + 0.55;
  }

  // Choc : forte perte de vitesse à proximité immédiate d'une police
  const drop = audio.prevSpeed - spd;
  if (drop > 0.35) {
    for (let i = 0; i < state.police.length; i++) {
      const p = state.police[i];
      if (Math.hypot(p.x - car.x, p.y - car.y) < 35) { playSfx('crash'); break; }
    }
  }
  audio.prevSpeed = spd;

  // Dérapage : virage à vitesse élevée
  const turning = state.keys['arrowleft'] || state.keys['arrowright'] || state.keys['q'] ||
                  state.keys['d'] || state.keys['a'] || state.touch.left || state.touch.right;
  if (turning && spd > 2 && t >= audio.skidCooldown && Math.random() < 0.3) {
    playSfx('skid');
    audio.skidCooldown = t + 0.6;
  }
}

// ---------- Sprites de voiture (vue de dessus, avant = -y) ----------
function carRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function carBodyGradient(base, light, dark) {
  const g = ctx.createLinearGradient(-8, 0, 8, 0);
  g.addColorStop(0, dark);
  g.addColorStop(0.35, base);
  g.addColorStop(0.5, light);
  g.addColorStop(0.7, base);
  g.addColorStop(1, dark);
  return g;
}

function drawCarChassis(c) {
  // Ombre portée
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  carRoundRect(-5.5, -12, 16, 30, 5);
  ctx.fill();

  // Roues avec jantes
  [[-9.4, -9], [9.4, -9], [-9.4, 9], [9.4, 9]].forEach(function (w) {
    ctx.fillStyle = '#0b0b0b';
    carRoundRect(w[0] - 2, w[1] - 3.8, 4, 7.6, 1.4);
    ctx.fill();
    ctx.fillStyle = '#9aa1ab';
    ctx.fillRect(w[0] - 1, w[1] - 1.6, 2, 3.2);
  });

  // Carrosserie dégradée
  carRoundRect(-8, -15, 16, 30, 4.5);
  ctx.fillStyle = carBodyGradient(c.base, c.light, c.dark);
  ctx.fill();
  ctx.lineWidth = 0.5;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.stroke();

  // Rétroviseurs
  ctx.fillStyle = c.dark;
  ctx.beginPath(); ctx.ellipse(-8.8, -5, 1.6, 1.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8.8, -5, 1.6, 1.1, 0, 0, Math.PI * 2); ctx.fill();
}

function drawCarGlass(c) {
  // Pare-brise
  const gl = ctx.createLinearGradient(0, -9.8, 0, -4.2);
  gl.addColorStop(0, '#17212b');
  gl.addColorStop(1, '#4f6d84');
  carRoundRect(-6.2, -9.8, 12.4, 5.6, 2.2);
  ctx.fillStyle = gl;
  ctx.fill();
  // Reflet
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(-4.5, -9); ctx.lineTo(-2.5, -9); ctx.lineTo(-5.4, -4.4); ctx.lineTo(-6, -4.4);
  ctx.closePath(); ctx.fill();

  // Toit
  carRoundRect(-6.2, -4.1, 12.4, 8.2, 2.2);
  ctx.fillStyle = c.roof;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 0.4;
  ctx.stroke();

  // Lunette arrière
  const gr = ctx.createLinearGradient(0, 4.2, 0, 8.8);
  gr.addColorStop(0, '#4f6d84');
  gr.addColorStop(1, '#17212b');
  carRoundRect(-5.8, 4.2, 11.6, 4.6, 2);
  ctx.fillStyle = gr;
  ctx.fill();
}

function drawCarLights(tailColor) {
  // Phares avant (halo + optique)
  [-5.2, 5.2].forEach(function (x) {
    const g = ctx.createRadialGradient(x, -14.5, 0, x, -14.5, 6);
    g.addColorStop(0, 'rgba(255,245,200,0.55)');
    g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, -14.5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffbe8';
    carRoundRect(x - 1.8, -14.6, 3.6, 1.6, 0.6);
    ctx.fill();
  });
  // Feux arrière
  [-5.2, 5.2].forEach(function (x) {
    const g = ctx.createRadialGradient(x, 14, 0, x, 14, 5);
    g.addColorStop(0, 'rgba(255,60,50,0.5)');
    g.addColorStop(1, 'rgba(255,60,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, 14, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = tailColor;
    carRoundRect(x - 1.8, 13.2, 3.6, 1.6, 0.6);
    ctx.fill();
  });
}

function drawTaxiSprite() {
  const c = { base: '#f7b500', light: '#ffe066', dark: '#a86f00', roof: '#f2a900' };
  drawCarChassis(c);
  drawCarGlass(c);
  // Enseigne TAXI sur le toit
  carRoundRect(-3.4, -2.4, 6.8, 3.6, 0.9);
  ctx.fillStyle = '#fff6d5';
  ctx.fill();
  ctx.strokeStyle = '#6b4a00';
  ctx.lineWidth = 0.4;
  ctx.stroke();

}

function drawPoliceSprite(chase, flashBlue) {
  const c = { base: '#f3f5f9', light: '#ffffff', dark: '#9aa6b8', roof: '#e6eaf1' };
  drawCarChassis(c);
  // Bandes bleues latérales
  ctx.fillStyle = '#1f4fd1';
  ctx.fillRect(-7.4, -11, 1.2, 22);
  ctx.fillRect(6.2, -11, 1.2, 22);
  drawCarGlass(c);
  // Barre lumineuse : bleu à gauche, rouge à droite, alternance en poursuite
  const blueOn = chase && flashBlue;
  const redOn = chase && !flashBlue;
  ctx.fillStyle = blueOn ? '#55aaff' : (chase ? '#1b3a6b' : '#3a3f47');
  ctx.fillRect(-4.2, -1.2, 4.2, 2.4);
  ctx.fillStyle = redOn ? '#ff3344' : (chase ? '#6b1a22' : '#3a3f47');
  ctx.fillRect(0, -1.2, 4.2, 2.4);
  drawCarLights('#ff3b30');
}

function drawPoliceCar(p) {
  const z = state.camera.zoom;
  const sp = toScreen(p.x, p.y);
  const zx = sp.x, zy = sp.y;
  if (zx < -60 || zx > viewW + 60 || zy < -60 || zy > viewH + 60) return;

  // Halo / gyrophare seulement en poursuite
  if (p.mode === 'chase') {
    ctx.beginPath();
    ctx.arc(zx, zy, (14 + Math.sin(p.sirenPhase * 2) * 3) * Math.max(0.5, Math.min(1.2, z * 0.45)), 0, Math.PI * 2);
    ctx.fillStyle = Math.sin(p.sirenPhase) > 0 ? 'rgba(40,120,255,0.35)' : 'rgba(255,50,60,0.35)';
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = Math.min(1, (p.age || 0) / 40);
  ctx.translate(zx, zy);
  ctx.rotate(screenAngle(p.angle));
  // Taille liée à l'altitude (zoom)
  const sc = Math.max(0.45, Math.min(1.35, z * 0.48));
  ctx.scale(sc, sc);

  drawPoliceSprite(p.mode === 'chase', Math.sin(p.sirenPhase) > 0);

  ctx.restore();
}

function drawRadarMarker(radar) {
  const point = toScreen(radar.x, radar.y);
  if (point.x < -24 || point.x > viewW + 24 || point.y < -24 || point.y > viewH + 24) return;
  ctx.save();
  ctx.translate(point.x, point.y);
  ctx.fillStyle = 'rgba(255, 35, 65, 0.22)';
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff334f';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, -2, 8, 4);
  ctx.beginPath();
  ctx.arc(0, 0, 1.4, 0, Math.PI * 2);

}


async function loadCity(gpsPosition) {
  audioInit();
  const name = cityInput.value.trim();
  if (!gpsPosition && !name) return;
  loadBtn.disabled = true;
  gpsBtn.disabled = true;
  statusEl.textContent = 'Chargement…';
  statusEl.className = '';
  state.tiles.clear();
  state.loadingTiles.clear();
  state.basemap = 'osm';
  state.usingFallbackMap = false;
  state.radarRequestId++;
  state.radarLoading = false;
  state.radarQueryCenter = null;
  state.radarCameras = [];
  showModal();

  try {
    let place, south, north, west, east;
    if (gpsPosition) {
      const lat = gpsPosition.latitude, lon = gpsPosition.longitude;
      // Une petite zone autour du GPS évite de télécharger puis traiter
      // plusieurs kilomètres de routes d'un coup sur les téléphones.
      const halfLat = 0.008, halfLon = 0.008;
      place = { display_name: 'Position GPS', boundingbox: [lat - halfLat, lat + halfLat, lon - halfLon, lon + halfLon] };
      cityInput.value = 'Ma position';
      state.centerLat = lat;
      state.centerLon = lon;
      [south, north, west, east] = place.boundingbox;
      setProgress(18, 'Position GPS obtenue');
    } else {
      setProgress(6, 'Recherche de la ville…');
      place = await geocodeCity(name);
      setProgress(18, 'Ville trouvée : ' + (place.display_name.split(',')[0] || name));
      const bbox = place.boundingbox.map(Number);
      south = bbox[0]; north = bbox[1]; west = bbox[2]; east = bbox[3];
      state.centerLat = (south + north) / 2;
      state.centerLon = (west + east) / 2;
    }

    // Charge quasi toute la ville (plafond ~12–14 km pour rester jouable)
    const maxSpan = 0.12;
    let s = south, n = north, w = west, e = east;
    const latSpan = north - south;
    const lonSpan = east - west;
    if (latSpan > maxSpan || lonSpan > maxSpan) {
      const halfLat = Math.min(latSpan, maxSpan) / 2;
      const halfLon = Math.min(lonSpan, maxSpan) / 2;
      s = state.centerLat - halfLat;
      n = state.centerLat + halfLat;
      w = state.centerLon - halfLon;
      e = state.centerLon + halfLon;
    }
    // Petite marge autour de la bbox Nominatim
    const pad = gpsPosition ? 0 : 0.004;
    s -= pad; n += pad; w -= pad; e += pad;

    setProgress(30, 'Téléchargement du réseau routier OSM…');
    let osm = null;
    let parsed;
    osm = await fetchOSM([s, w, n, e], function(message) {
      setProgress(34, message);
    });
    parsed = parseOSM(osm);
    if (!parsed.roads.length) throw new Error('Aucune route trouvée dans les données OSM');
    state.basemap = 'osm';
    state.usingFallbackMap = false;
    setProgress(68, 'Analyse des données OpenStreetMap…');

    state.roads = parsed.roads;
    state.buildings = parsed.buildings;

    setProgress(78, 'Réseau routier…');
    buildSegments();
    setProgress(86, 'Rendu des routes…');
    bakeRoads();
    setProgress(93, 'Finalisation du décor…');
    bakeBuildings();

    const start = centerStart();
    state.car.x = start.x; state.car.y = start.y;
    state.car.angle = start.angle;
    if (gpsPosition) {
      const gpsPoint = latLonToLocal(gpsPosition.latitude, gpsPosition.longitude);
      state.car.x = gpsPoint.x; state.car.y = gpsPoint.y;
      if (Number.isFinite(gpsPosition.heading)) state.car.angle = gpsPosition.heading * Math.PI / 180;
    }
    state.car.speed = 0;
    state.camera.x = start.x; state.camera.y = start.y;
    state.camera.zoom = 2.2;
    state.loaded = true;
    constrainToRoad();
    if (state.radarLayer) refreshRadars(true);

    setProgress(97, 'Déploiement des forces de l\'ordre…');
    spawnPolice(POLICE_START);

    setProgress(100, 'Terminé');
    await new Promise(function(r) { setTimeout(r, 250); });

    infoRoutesEl.textContent = 'Routes : ' + state.roads.length + ' · Bâtiments : ' + state.buildings.length;
    statusEl.textContent = '✓ ' + place.display_name.split(',')[0] + ' — données OpenStreetMap · 2 polices en chasse';
    statusEl.className = 'ok';
  } catch (err) {
    console.error(err);
    setProgress(0, 'Erreur');
    statusEl.textContent = 'Erreur : ' + err.message;
    statusEl.className = 'error';
    state.loaded = false;
    await new Promise(function(r) { setTimeout(r, 500); });
  } finally {
    hideModal();
    loadBtn.disabled = false;
    gpsBtn.disabled = false;
  }
}

  if (!navigator.geolocation) {

    statusEl.className = 'error';

  }
  gpsBtn.disabled = true;

  navigator.geolocation.getCurrentPosition(function(position) {

  }, function(error) {

    const messages = {
      1: 'Autorise l’accès à la position dans ton navigateur pour utiliser le GPS.',
      2: 'Position GPS indisponible. Réessaie dans un instant.',

gpsFollow.addEventListener('change', function() {
  if (!gpsFollow.checked) {
    if (gpsWatchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
    lastGpsFix = null;
    if (state.loaded) {
      statusEl.textContent = 'Suivi GPS arrêté.';
      statusEl.className = '';
    }
    return;
  }
  if (!navigator.geolocation) {
    gpsFollow.checked = false;
    statusEl.textContent = 'La géolocalisation n’est pas disponible sur cet appareil.';
    statusEl.className = 'error';
    return;
  }
  statusEl.textContent = 'Suivi GPS en attente de position…';
  statusEl.className = '';
  try {
    gpsWatchId = navigator.geolocation.watchPosition(function(position) {
      const coords = position.coords;
      if (!state.loaded) {
        if (gpsMapLoading) return;
        gpsMapLoading = true;
        loadCity(coords).finally(function() { gpsMapLoading = false; });
      } else {
        const point = latLonToLocal(coords.latitude, coords.longitude);
        if (lastGpsFix) {
          const dx = point.x - lastGpsFix.x, dy = point.y - lastGpsFix.y;
          const distance = Math.hypot(dx, dy);
          if (distance > 1.5) {
            const speedMps = Number.isFinite(coords.speed) ? coords.speed : distance / Math.max(0.1, (position.timestamp - lastGpsFix.timestamp) / 1000);
            if (Number.isFinite(coords.heading) && speedMps > 0.8) {
              state.car.angle = coords.heading * Math.PI / 180;
            } else if (speedMps > 0.8) {
              state.car.angle = Math.atan2(dx, -dy);
            }
          }
        }
        state.car.x = point.x;
        state.car.y = point.y;
        state.car.speed = 0;
        state.camera.x = point.x;
        state.camera.y = point.y;
        lastGpsFix = { x: point.x, y: point.y, timestamp: position.timestamp };
        statusEl.textContent = 'Suivi GPS actif — position mise à jour.';
        statusEl.className = 'ok';
      }
    }, function(error) {
      const messages = {
        1: 'Autorise l’accès à la position dans ton navigateur pour utiliser le GPS.',
        2: 'Position GPS indisponible. Le suivi reste actif.',
        3: 'La demande GPS a expiré. Le suivi reste actif.'
      };
      statusEl.textContent = messages[error.code] || 'Impossible de récupérer la position GPS.';
      statusEl.className = 'error';
      if (error.code === 1) {
        if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        lastGpsFix = null;
        gpsFollow.checked = false;
      }
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  } catch (error) {
    gpsFollow.checked = false;
    gpsWatchId = null;
    statusEl.textContent = 'Impossible de démarrer la géolocalisation. Vérifie les autorisations du navigateur.';
    statusEl.className = 'error';
  }
});

// Point de départ : la route la plus proche du centre de la carte (0, 0 en coordonnées locales).
function centerStart() {
  const cx = 0, cy = 0;
  let best = null, bestD = Infinity;
  for (let r = 0; r < state.roads.length; r++) {
    const pts = state.roads[r].points;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((cx - a.x) * dx + (cy - a.y) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const px = a.x + t * dx, py = a.y + t * dy;
      const d = (px - cx) * (px - cx) + (py - cy) * (py - cy);
      if (d < bestD) { bestD = d; best = { x: px, y: py, dx: dx, dy: dy }; }
    }
  }
  if (!best) {
    const p = state.roads[0].points[0];
    const p2 = state.roads[0].points[1] || p;
    return { x: p.x, y: p.y, angle: Math.atan2(p2.x - p.x, -(p2.y - p.y)) };
  }
  // Angle = direction du segment de route trouvé.
  return { x: best.x, y: best.y, angle: Math.atan2(best.dx, -best.dy) };
}

function resetCar() {
  if (!state.roads.length) return;
  const start = centerStart();
  state.car.x = start.x; state.car.y = start.y;
  state.car.speed = 0;
  state.car.angle = start.angle;
  state.gameOver = false;
  state.closeTimer = 0;
  constrainToRoad();
  spawnPolice(POLICE_START);
}
