function steeringAssist(car, manualLeft, manualRight) {
  const nearest = findNearestRoad(car.x, car.y);
  if (!nearest) return;

  // Direction du segment le plus proche
  // On retrouve un segment proche pour l'orientation
  const bestSeg = nearest.seg;
  if (!bestSeg) return;

  let roadAngle = Math.atan2(bestSeg.x2 - bestSeg.x1, -(bestSeg.y2 - bestSeg.y1));
  // Choisir le sens le plus proche de l'orientation actuelle
  let diff = roadAngle - car.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  let diffFlip = diff + (diff > 0 ? -Math.PI : Math.PI);
  if (Math.abs(diffFlip) < Math.abs(diff)) {
    roadAngle += Math.PI;
    diff = diffFlip;
  }

  // Force d'aide réduite si le joueur braque déjà
  const manual = manualLeft || manualRight;
  const alignStrength = manual ? 0.035 : 0.09;
  car.angle += Math.max(-0.06, Math.min(0.06, diff * alignStrength));

  // Ramène doucement vers le centre de voie
  const dx = nearest.x - car.x;
  const dy = nearest.y - car.y;
  const off = Math.hypot(dx, dy);
  if (off > 1.2) {
    const pull = manual ? 0.04 : 0.11;
    car.x += dx * pull;
    car.y += dy * pull;
  }
}

function updateCar() {
  if (state.gameOver) return;

  // En suivi GPS, la position et le cap viennent directement du navigateur.
  if (gpsFollow.checked) return;

  const c = state.car;
  const up = state.keys['arrowup'] || state.keys['z'] || state.keys['w'] || state.touch.accel;
  const down = state.keys['arrowdown'] || state.keys['s'] || state.touch.brake;
  const left = state.keys['arrowleft'] || state.keys['q'] || state.keys['a'] || state.touch.left;
  const right = state.keys['arrowright'] || state.keys['d'] || state.touch.right;

  if (up) c.speed += c.accel;
  if (down) c.speed -= c.accel * 0.7;
  c.speed *= c.friction;
  if (Math.abs(c.speed) < 0.015) c.speed = 0;
  c.speed = Math.max(-c.maxSpeed * 0.4, Math.min(c.maxSpeed, c.speed));

  // Tourne mieux même à faible vitesse
  const turnFactor = Math.max(0.45, Math.min(1, Math.abs(c.speed) / 1.4)) *
    Math.max(0.55, 1 - Math.max(0, Math.abs(c.speed) - 2.5) * 0.12);
  const dir = Math.sign(c.speed || 1);
  if (left) c.angle -= c.turnSpeed * turnFactor * dir;
  if (right) c.angle += c.turnSpeed * turnFactor * dir;

  c.x += Math.sin(c.angle) * c.speed;
  c.y -= Math.cos(c.angle) * c.speed;

  // Aide à la direction : aligne vers la route + ramène au centre
  steeringAssist(c, left, right);

  constrainToRoad();

  if (state.police.length) updatePolice();

  state.camera.x += (c.x - state.camera.x) * 0.16;
  state.camera.y += (c.y - state.camera.y) * 0.16;

  // Zoom auto selon la vitesse (plus vite = plus haut / dézoomé)
  const spd = Math.abs(c.speed);
  // zoom élevé = proche du sol ; faible = altitude
  const baseZoom = 2.55 - Math.min(1.35, spd * 0.42);
  state.camera.targetZoom = Math.max(1.0, Math.min(2.7, baseZoom)) * state.camera.userZoomMul;
  state.camera.zoom += (state.camera.targetZoom - state.camera.zoom) * 0.08;
}

function drawMinimap() {
  const size = 120;
  const range = 180; // mètres visibles autour de la voiture
  mmCtx.fillStyle = '#0c1018';
  mmCtx.fillRect(0, 0, size, size);

  const scale = size / (range * 2);
  const cx = state.car.x, cy = state.car.y;

  // Routes
  mmCtx.strokeStyle = 'rgba(180,190,210,0.7)';
  mmCtx.lineWidth = 1.2;
  mmCtx.lineCap = 'round';
  for (let r = 0; r < state.roads.length; r++) {
    const road = state.roads[r];
    const pts = road.points;
    if (pts.length < 2) continue;
    // Rectangle englobant calculé une seule fois par route
    if (!road._bb) {
      let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        if (pts[i].x < mnx) mnx = pts[i].x;
        if (pts[i].x > mxx) mxx = pts[i].x;
        if (pts[i].y < mny) mny = pts[i].y;
        if (pts[i].y > mxy) mxy = pts[i].y;
      }
      road._bb = { minX: mnx, minY: mny, maxX: mxx, maxY: mxy };
    }
    const bb = road._bb;
    if (bb.maxX < cx - range || bb.minX > cx + range || bb.maxY < cy - range || bb.minY > cy + range) continue;
    mmCtx.beginPath();
    let started = false;
    for (let i = 0; i < pts.length; i++) {
      const sx = (pts[i].x - cx) * scale + size / 2;
      const sy = (pts[i].y - cy) * scale + size / 2;
      if (sx < -10 || sx > size + 10 || sy < -10 || sy > size + 10) {
        started = false;
        continue;
      }
      if (!started) { mmCtx.moveTo(sx, sy); started = true; }
      else mmCtx.lineTo(sx, sy);
    }
    mmCtx.stroke();
  }

  // Police sur mini-carte
  for (let i = 0; i < state.police.length; i++) {
    const p = state.police[i];
    const sx = (p.x - cx) * scale + size / 2;
    const sy = (p.y - cy) * scale + size / 2;
    if (sx < 2 || sx > size - 2 || sy < 2 || sy > size - 2) continue;
    mmCtx.fillStyle = '#3a7cff';
    mmCtx.beginPath();
    mmCtx.arc(sx, sy, 3, 0, Math.PI * 2);
    mmCtx.fill();
  }

  if (state.radarLayer) {
    for (let i = 0; i < state.radarCameras.length; i++) {
      const radar = state.radarCameras[i];
      const sx = (radar.x - cx) * scale + size / 2;
      const sy = (radar.y - cy) * scale + size / 2;
      if (sx < 3 || sx > size - 3 || sy < 3 || sy > size - 3) continue;
      mmCtx.beginPath();
      mmCtx.arc(sx, sy, 5, 0, Math.PI * 2);
      mmCtx.fillStyle = '#ff354f';
      mmCtx.fill();
      mmCtx.strokeStyle = '#fff';
      mmCtx.lineWidth = 1.5;
      mmCtx.stroke();
    }
  }

  // Voiture joueur
  mmCtx.save();
  mmCtx.translate(size / 2, size / 2);
  mmCtx.rotate(state.car.angle);
  mmCtx.fillStyle = '#e74c3c';
  mmCtx.fillRect(-3, -5, 6, 10);
  mmCtx.restore();

  // Cadre
  mmCtx.strokeStyle = 'rgba(255,255,255,0.15)';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(0.5, 0.5, size - 1, size - 1);
}

// ---------- Effets de post-traitement : tilt-shift (mode 3D) et teinte de poursuite ----------
const fx = { checked: false, filterOK: false, off: null, tmp: null, tint: 0 };

function fxCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function applyPostFx() {
  // Le flou (ctx.filter) n'existe pas partout : on le teste une seule fois
  if (!fx.checked) {
    fx.checked = true;
    try {
      ctx.filter = 'blur(1px)';
      fx.filterOK = ctx.filter === 'blur(1px)';
      ctx.filter = 'none';
    } catch (e) { fx.filterOK = false; }
  }
  const W = canvas.width, H = canvas.height;

  // Teinte bleu/rouge pendant la poursuite, alternance au rythme de la sirène
  const target = state.wanted && !state.gameOver ? 1 : 0;
  fx.tint += (target - fx.tint) * 0.08;
  if (fx.tint > 0.01) {
    const blueOn = Math.floor(performance.now() / 250) % 2 === 0;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.14 * fx.tint;
    ctx.fillStyle = blueOn ? '#2a6dff' : '#ff3030';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // Tilt-shift : flou sur le haut et le bas de l'écran, plus fort quand l'angle est bas
  if (fx.filterOK && state.viewMode === 'tilt') {
    const k = (TILT_MAX - state.tiltDeg) / (TILT_MAX - TILT_MIN); // 0 à 85°, 1 à 25°
    const band = 0.2 + 0.2 * k;                 // part de l'écran restée nette au centre
    const blurPx = (1.5 + 2.5 * k) * dprCur;

    if (!fx.off || fx.off.width !== Math.ceil(W / 2) || fx.tmp.width !== W) {
      fx.off = fxCanvas(Math.ceil(W / 2), Math.ceil(H / 2));
      fx.tmp = fxCanvas(W, H);
    }
    const oc = fx.off.getContext('2d');
    const tc = fx.tmp.getContext('2d');

    // 1. Image réduite de moitié (base du flou, peu coûteuse)
    oc.clearRect(0, 0, fx.off.width, fx.off.height);
    oc.drawImage(canvas, 0, 0, fx.off.width, fx.off.height);

    // 2. Version floutée, puis masque en dégradé : nette au centre, floue aux bords
    tc.setTransform(1, 0, 0, 1, 0, 0);
    tc.clearRect(0, 0, W, H);
    tc.filter = 'blur(' + blurPx + 'px)';
    tc.drawImage(fx.off, 0, 0, W, H);
    tc.filter = 'none';
    tc.globalCompositeOperation = 'destination-in';
    const g = tc.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(band, 'rgba(0,0,0,0)');
    g.addColorStop(1 - band, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    tc.fillStyle = g;
    tc.fillRect(0, 0, W, H);
    tc.globalCompositeOperation = 'source-over';

    // 3. Superposition sur la scène
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(fx.tmp, 0, 0);
    ctx.restore();
  }
}

function draw() {
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, viewW, viewH);

  if (!state.loaded) {
    ctx.fillStyle = '#777';
    ctx.font = '15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Choisis une ville puis appuie sur Charger', viewW / 2, viewH / 2);
    return;
  }
  if (state.radarLayer) refreshRadars(false);

  updateViewMatrix();
  ctx.save();
  applyMapTransform();
  drawSatellite();

  // Bâtiments 2.5D
  if (state.buildingCanvas) {
    ctx.drawImage(state.buildingCanvas, state.buildOriginX, state.buildOriginY,
      state.buildingCanvas.width / state.buildScale, state.buildingCanvas.height / state.buildScale);
  }

  // Routes
  if (state.roadCanvas) {
    ctx.drawImage(state.roadCanvas, state.roadOriginX, state.roadOriginY,
      state.roadCanvas.width / state.roadScale, state.roadCanvas.height / state.roadScale);
  }
  ctx.restore();

  // Police
  for (let i = 0; i < state.police.length; i++) {
    drawPoliceCar(state.police[i]);
  }

  if (state.radarLayer) {
    for (let i = 0; i < state.radarCameras.length; i++) drawRadarMarker(state.radarCameras[i]);
  }

  // Voiture joueur (taille selon altitude/zoom)
  const car = state.car;
  const zCam = state.camera.zoom;
  const scr = toScreen(car.x, car.y);
  const zx = scr.x, zy = scr.y;
  const sc = Math.max(0.45, Math.min(1.35, zCam * 0.48));
  ctx.save();
  ctx.translate(zx, zy);
  ctx.rotate(screenAngle(car.angle));
  ctx.scale(sc, sc);
  drawTaxiSprite();
  ctx.restore();

  applyPostFx();
  // HUD texte
  speedEl.textContent = Math.round(Math.abs(car.speed) * 18);
  streetNameEl.textContent = state.currentStreet || '—';
  if (state.police.length && state.closeTimer > 0.05) {
    const left = Math.max(0, 10 - state.closeTimer);
    infoRoutesEl.textContent = 'ALERTE police : ' + left.toFixed(1) + 's';
    infoRoutesEl.style.color = left < 3 ? '#ff6b6b' : '#ffcc66';
  } else if (state.loaded && !state.gameOver) {
    infoRoutesEl.style.color = '';
    infoRoutesEl.textContent = 'Routes : ' + state.roads.length + ' · Bâtiments : ' + state.buildings.length;
  }

  // Game Over
  if (state.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.fillStyle = '#ff4d4d';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', viewW / 2, viewH / 2 - 12);
    ctx.fillStyle = '#eee';
    ctx.font = '14px system-ui';
    ctx.fillText('La police t\'a coincé — appuie sur R pour recommencer', viewW / 2, viewH / 2 + 18);
  }

  drawMinimap();
}

function loop() {
  if (state.loaded) updateCar();
  updateSound();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Charge automatiquement la carte par défaut au démarrage.
statusEl.textContent = 'Chargement de la carte par défaut : Olonne-sur-Mer…';
window.addEventListener('load', function() {
  loadCity();
}, { once: true });
</script>
