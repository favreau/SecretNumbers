.w{animation:wf 5s ease-in-out infinite}

body.boss .scene::after{background:radial-gradient(ellipse at 22% 100%,#8C1C3A 0 46%,transparent 47%),radial-gradient(ellipse at 72% 100%,#5A0F28 0 42%,transparent 43%)}
#party{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-60px;display:block;animation:fall 7s linear infinite}

</style>

<script>
const S=[
'<svg viewBox="0 0 100 100"><path d="M20 62C14 34 34 16 62 14C74 13 82 22 74 30C58 36 50 48 52 66C54 80 40 88 30 82C24 78 21 70 20 62Z" fill="#FFE066" stroke="#E8B100" stroke-width="4" stroke-linejoin="round"/><path d="M62 14C68 10 72 10 74 14" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="29" cy="38" rx="4" ry="9" transform="rotate(-20 29 38)" fill="#fff" opacity=".6"/><circle cx="31" cy="60" r="3.5" fill="#5B3B6E"/><circle cx="43" cy="62" r="3.5" fill="#5B3B6E"/><path d="M34 68Q37 72 41 68" stroke="#5B3B6E" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="26" cy="67" r="3" fill="#FF8FB8" opacity=".7"/><circle cx="47" cy="69" r="3" fill="#FF8FB8" opacity=".7"/></svg>',
'<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="34" fill="#FFE066" stroke="#E8B100" stroke-width="4"/><path d="M46 22Q44 8 57 12Q50 16 54 22" fill="#FFE066" stroke="#E8B100" stroke-width="3" stroke-linejoin="round"/><ellipse cx="34" cy="38" rx="6" ry="10" transform="rotate(30 34 38)" fill="#fff" opacity=".55"/><ellipse cx="50" cy="63" rx="14" ry="8" fill="#FF9F43" stroke="#E57F1F" stroke-width="2.5"/><circle cx="38" cy="48" r="4.5" fill="#5B3B6E"/><circle cx="62" cy="48" r="4.5" fill="#5B3B6E"/><circle cx="39.5" cy="46.5" r="1.5" fill="#fff"/><circle cx="63.5" cy="46.5" r="1.5" fill="#fff"/><circle cx="27" cy="58" r="4" fill="#FF8FB8" opacity=".7"/><circle cx="73" cy="58" r="4" fill="#FF8FB8" opacity=".7"/></svg>',
'<svg viewBox="0 0 100 100"><path d="M50 90L12 28Q50 8 88 28Z" fill="#FFD166" stroke="#E39B1F" stroke-width="4" stroke-linejoin="round"/><path d="M12 28Q50 8 88 28" fill="none" stroke="#E08A4A" stroke-width="10" stroke-linecap="round"/><circle cx="32" cy="38" r="6" fill="#FF6F7D"/><circle cx="67" cy="38" r="6" fill="#FF6F7D"/><circle cx="50" cy="73" r="5" fill="#FF6F7D"/><ellipse cx="30" cy="30" rx="3" ry="6" fill="#fff" opacity=".5"/><circle cx="42" cy="52" r="3.5" fill="#5B3B6E"/><circle cx="58" cy="52" r="3.5" fill="#5B3B6E"/><path d="M45 59Q50 64 55 59" stroke="#5B3B6E" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="36" cy="58" r="3" fill="#FF8FB8" opacity=".7"/><circle cx="64" cy="58" r="3" fill="#FF8FB8" opacity=".7"/></svg>'];
const N=["Banane","Canard","Pizza"];
const R=n=>Math.floor(Math.random()*n);
const m3=x=>((x%3)+3)%3;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=f=>{const g=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)g.push(f(r,c));return g};
const ALL=[0,1,2,3,4,5,6,7,8];

const LV0=[
 {t:"Niveau 1. Rassure-toi, c’est calibré pour les débutants.",
  g(){let p;do p=[R(3),R(3),R(3)];while(new Set(p).size<2);return mk((r,c)=>p[c])},ok:ALL},
 {t:"Niveau 2. Chaque ligne a son idée. À toi de la trouver.",
  g(){const rows=[0,1,2].map(()=>sh([0,1,2]));return mk((r,c)=>rows[r][c])},ok:ALL},
 {t:"Niveau 3. Lignes ET colonnes. Respire, ça va aller.",
  g(){const p=sh([0,1,2]),d=1+R(2),o=sh([0,1,2]);return mk((r,c)=>p[(o[r]*d+c)%3])},ok:ALL},
 {t:"Niveau 4. Un peu de symétrie. Les humains aiment ça, non ?",
  g(){const a=[R(3),R(3),R(3)],b=[R(3),R(3),R(3)];return mk((r,c)=>c==1?b[r]:(c==0?a[r]:a[r]))},ok:[0,2,3,5,6,8]},
 {t:"Niveau 5. La symétrie, version tête en bas.",
  g(){const q=[R(3),R(3),R(3),R(3),R(3)],g=[];for(let i=0;i<4;i++)g[i]=q[i];g[4]=q[4];for(let i=0;i<4;i++)g[8-i]=q[i];return g},ok:[0,1,2,3,5,6,7,8]},
 {t:"Niveau 6. Les diagonales ont leur mot à dire.",
  g(){const a=1+R(2),b=1+R(2),k=R(3);return mk((r,c)=>m3(a*r+b*c+k))},ok:ALL},
 {t:"Niveau 7. Là, il va falloir compter. Oui, avec un cerveau.",
  g(){const x=[],y=[];const c0=[R(3),R(3),R(3)],c1=[R(3),R(3),R(3)];return mk((r,c)=>c==0?c0[r]:c==1?c1[r]:m3(c0[r]+c1[r]))},ok:ALL},
 {t:"Niveau 8. Soustraire des formes. Je te laisse y réfléchir.",
  g(){const c0=[R(3),R(3),R(3)],c1=[R(3),R(3),R(3)];return mk((r,c)=>c==0?c0[r]:c==1?c1[r]:m3(c0[r]-c1[r]))},ok:ALL},

  g(){const a=R(3),b=R(3),c=R(3),d=R(3),G=[a,b,m3(a+b),c,d,m3(c+d),m3(a+c),m3(b+d),m3(a+b+c+d)];return G},ok:ALL},
 {n:4,T:10000,t:"Niveau 10. Quatre créatures, dix secondes. Je t’avais dit de ne pas regarder.",g(){const p=sh([0,1,2,3]),ro=sh([0,1,2,3]),co=sh([0,1,2,3]);return Array.from({length:16},(_,i)=>p[(ro[i>>2]+co[i&3])%4])},ok:Array.from({length:16},(_,i)=>i)}

const LV=[
 {t:"Niveau 1. Rassure-toi, c’est calibré pour les débutants.",

const OK=["Correct. Même une horloge arrêtée a raison deux fois par jour.","Bien. Je classe ça comme un accident statistique.","Oui. Tu vois, quand tu te concentres…","Exact. J’allais presque être impressionnée.","Juste. Les prochaines générations de toi iront plus vite."];
const KO=["Non. Je t’accorde le bénéfice du doute. Un tout petit.","Raté. Les formes sont gênées pour toi.","Faux. Au hasard, tu avais une chance sur trois. Bravo.","Non. Tu veux que je te fasse un dessin ?","Erreur. Mon processeur en a mal pour toi."];
const pick=a=>a[R(a.length)];
const $=id=>document.getElementById(id);

let lvl,err,grid,miss,locked,tried,score=0;

function SS(){return LV[lvl].n?S.concat([BO]):S}
function lvlTxt(){$("lvl").textContent="Niveau "+(lvl+1)+" / "+LV.length+(LV[lvl].n?" (boss)":"")+", "+score+" pts"}
function draw(){
  lvlTxt();
  $("lives").setAttribute("aria-label",(3-err)+" vies restantes");
  $("lives").innerHTML=[0,1,2].map(i=>'<i class="'+(i<err?"x":"")+'"></i>').join("");
  $("grid").innerHTML=grid.map((v,i)=>'<div class="cell'+(i===miss?" miss":"")+'">'+(i===miss?"?":SS()[v])+"</div>").join("");
  $("ch").innerHTML=SS().map((s,i)=>'<button data-i="'+i+'" aria-label="'+(N[i]||"Bombe")+'"'+(tried.has(i)?" disabled":"")+">"+s+"</button>").join("");
}
function say(t){$("msg").textContent=t}
function start(){
  const L=LV[lvl];grid=L.g();miss=L.ok[R(L.ok.length)];tried=new Set();locked=false;T=L.T||15000;document.body.classList.toggle("boss",!!L.n);pt++;$("party").innerHTML="";document.body.classList.remove("party");$("grid").style.gridTemplateColumns=$("ch").style.gridTemplateColumns="repeat("+(L.n||3)+",1fr)";
  draw();say(L.t);arm();
}
function cellEl(){return $("grid").children[miss]}
function finish(win){
  stopB();win?SFX.win():SFX.lose();locked=true;$("ch").style.display="none";
  $("eh").className=win?"win":"";if(win){$("eh").innerHTML='<span class="dance">'+S.concat([BO]).join("")+'</span>Victoire !';party()}else $("eh").textContent="Game over";
  $("ep").textContent="Score : "+score+" / "+LV.reduce((a,l)=>a+(l.T||15000)/1000,0)+". "+(win?"Dix niveaux. Je révise ton espèce à la hausse. Très légèrement.":"Trois erreurs. Le futur appartient à ceux qui savent compter jusqu’à trois.");
  $("end").classList.add("on");
  say(win?"Bravo. Ne le répète à personne, j’ai une réputation.":"Je te l’avais dit. Enfin, je l’ai pensé très fort.");
}
function answer(i){
  if(locked)return;
  const good=grid[miss];
  if(i===good){
    const gain=Math.max(0,Math.ceil((dl-Date.now())/1000));score+=gain;lvlTxt();stopB();SFX.ok();locked=true;const c=cellEl();c.className="cell ok";c.innerHTML=SS()[good];say(pick(OK)+" +"+gain+" pts.");
    setTimeout(()=>{lvl++;if(lvl>=LV.length){finish(true)}else if(LV[lvl].n){bossIntro()}else start()},1100);
  }else{
    err++;tried.add(i);SFX.ko();say(pick(KO));
    const g=$("grid");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");
    if(err>=3){draw();const c=cellEl();c.className="cell bad";c.innerHTML=SS()[good];finish(false)}else draw();
  }
}
let AC,mute=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,t0,f2){if(!AC||mute)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v){if(!AC||mute)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=900;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
const SFX={ok(){tone(260,.18,"sine",.3,0,620);tone(520,.22,"sine",.25,.12,1040)},ko(){tone(800,.22,"sine",.3,0,200);tone(180,.2,"triangle",.2,.05,90)},boom(){noise(.9,.7);tone(90,.6,"sine",.5,0,30)},win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.28,"triangle",.22,i*.12));[523,659,784,1047].forEach(f=>tone(f,1.2,"triangle",.12,.9));for(let i=0;i<8;i++)tone(1600+R(1400),.12,"sine",.08,1.2+i*.18)},pop(){noise(.18,.3);tone(900,.12,"sine",.15,0,1800)},lose(){[330,262,196,131].forEach((f,i)=>tone(f,.35,"sawtooth",.12,.5+i*.2))},tick(h){tone(h?1500:1000,.04,"square",h?.08:.04)}};
document.addEventListener("pointerdown",ac);document.addEventListener("keydown",ac);
$("mu").addEventListener("click",()=>{mute=!mute;$("mu").textContent=mute?"🔇":"🔊";$("mu").setAttribute("aria-label",mute?"Remettre le son":"Couper le son")});
let tm,dl,nb,dr,T=15000;const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function drone(){if(!AC||dr)return;const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),s=AC.createOscillator(),sg=AC.createGain();o.type="sawtooth";f.type="lowpass";f.frequency.value=500;g.gain.value=0;s.type="square";sg.gain.value=0;o.connect(f);f.connect(g);g.connect(AC.destination);s.connect(sg);sg.connect(AC.destination);o.start();s.start();dr={o,g,s,sg}}

function stopB(){clearInterval(tm);killDrone();document.documentElement.style.setProperty("--d",0)}
function beat(s){tone(62,.16,"sine",.7,0,40);tone(58,.14,"sine",.55,.16,38);tone(1200+s*900,.03,"square",.05+s*.05,.02)}
function tick(){
  if(AC&&!dr)drone();
  const now=Date.now(),left=Math.max(0,dl-now),s=1-left/T;
  if(now>=nb&&left>0){beat(s);nb=now+900-620*s}
  if(dr&&AC){const t=AC.currentTime,v=mute?0:1;dr.o.frequency.setTargetAtTime(55+s*s*260,t,.05);dr.g.gain.setTargetAtTime(v*(.02+.07*s),t,.05);dr.s.frequency.setValueAtTime(Math.floor(now/200)%2?880:660,t);dr.sg.gain.setTargetAtTime(left<5000?v*.035:0,t,.02)}

}
$("ch").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.disabled)answer(+b.dataset.i)});
let pt=0;
function party(){
  const tok=++pt,P=$("party"),C=["#FF8FC1","#7BE0C3","#FFD166","#CDB8FF","#FF6F7D","#8EC5FF"],A=S.concat([BO]);
  document.body.classList.remove("boss");document.body.classList.add("party");

}

const W=[[18,70],[32,70],[18,82],[32,82],[68,56],[80,56],[68,70],[80,70],[114,74],[130,74],[168,48],[178,48],[168,62],[178,62],[210,68],[226,68],[262,58],[274,58],[262,72],[274,72],[310,72],[326,72],[360,54],[374,54],[360,68],[374,68]];
