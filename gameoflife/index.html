<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game of Life viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf2; --panel:#ffffff; --ink:#1b2433; --muted:#5d6879; --line:#cfd6e0;
  --cell:#1b2433; --born:#2f5bea; --grid:#dfe5ec; --field:#f7f9fb; --accent:#2f5bea; --on-accent:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151c; --panel:#1a202a; --ink:#e8ecf3; --muted:#98a3b5; --line:#2c3543;
    --cell:#e8ecf3; --born:#7fa2ff; --grid:#232b37; --field:#12171e; --accent:#7fa2ff; --on-accent:#0f1420;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf3; --muted:#98a3b5; --line:#2c3543;
  --cell:#e8ecf3; --born:#7fa2ff; --grid:#232b37; --field:#12171e; --accent:#7fa2ff; --on-accent:#0f1420;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:var(--side,300px) 16px minmax(0,1fr);gap:0;padding:16px;max-width:1500px;margin:0 auto}
.split{position:relative;cursor:col-resize;touch-action:none;border-radius:6px}
.split::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line);border-radius:1px}
.split::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:44px;margin:-22px 0 0 -3px;background:var(--muted);border-radius:3px;z-index:1;opacity:.6}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--accent)}
.split:hover::before,.split.on::before,.split:focus-visible::before{background:var(--accent);opacity:1}
.split:focus-visible{outline:none}
@media (max-width:820px){.app{grid-template-columns:1fr;gap:16px}.split{display:none}aside{position:static;max-height:none;overflow:visible}main{order:-1}.stats{margin-left:0}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:600;padding:0;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input[type=number],input[type=text],select{
  font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bad{border-color:#d33!important}
.hint{font-size:12px;color:var(--muted);min-height:1.2em}
main{min-width:0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btns{display:flex;gap:6px}
.btns button{min-width:68px}
.speed{flex-direction:row;align-items:center;gap:8px;white-space:nowrap}
.speed input{width:130px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;font-variant-numeric:tabular-nums}
.stats b{font-size:20px;font-weight:800;margin-right:5px}
.stats span{color:var(--muted)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;display:flex;justify-content:center}
canvas{display:block;touch-action:none;cursor:crosshair;background:var(--field)}
</style>
</head>
<body>
<div class="app">
<aside>
  <div>
    <h1>Game of Life</h1>
    <p class="sub">Click or drag on the grid to draw. Cells in blue were just born.</p>
  </div>

  <fieldset>
    <legend>Grid</legend>
    <div class="row">
      <label>Columns<input id="cols" type="number" min="5" max="300" value="80"></label>
      <label>Rows<input id="rows" type="number" min="5" max="300" value="50"></label>
    </div>
    <label class="inline"><input id="wrap" type="checkbox" checked> Wrap edges (torus)</label>
  </fieldset>

  <fieldset>
    <legend>Rules</legend>
    <label>Preset
      <select id="preset">
        <option value="B3/S23">Conway’s Life (B3/S23)</option>
        <option value="B36/S23">HighLife (B36/S23)</option>
        <option value="B2/S">Seeds (B2/S)</option>
        <option value="B3678/S34678">Day &amp; Night (B3678/S34678)</option>
        <option value="B1357/S1357">Replicator (B1357/S1357)</option>
        <option value="B3/S012345678">Life without death (B3/S012345678)</option>
        <option value="B368/S245">Morley (B368/S245)</option>
        <option value="B35678/S5678">Diamoeba (B35678/S5678)</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <label>Birth / survival
      <input id="rule" type="text" value="B3/S23" spellcheck="false" autocomplete="off">
    </label>
    <div class="hint" id="ruleHint">A dead cell is born with these neighbor counts (B); a live cell survives with these (S).</div>
  </fieldset>

  <fieldset>
    <legend>Initial pattern</legend>
    <label>Pattern
      <select id="pattern">
        <option value="random">Random fill</option>
        <option value="glider">Glider</option>
        <option value="lwss">Lightweight spaceship</option>
        <option value="blinker">Blinker</option>
        <option value="pulsar">Pulsar</option>
        <option value="penta">Pentadecathlon</option>
        <option value="rpent">R-pentomino</option>
        <option value="acorn">Acorn</option>
        <option value="diehard">Diehard</option>
        <option value="gun">Gosper glider gun</option>
      </select>
    </label>
    <label id="densityWrap">Density: <span id="densityVal">30</span>%
      <input id="density" type="range" min="1" max="90" value="30">
    </label>
    <button id="load">Load pattern</button>
  </fieldset>
</aside>

<div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize parameters panel" tabindex="0"></div>

<main>
  <div class="bar">
    <div class="btns">
      <button id="play" class="primary">Play</button>
      <button id="step">Step</button>
      <button id="clear">Clear</button>
    </div>
    <label class="speed">Speed <span id="speedVal">15</span>/s
      <input id="speed" type="range" min="1" max="60" value="15">
    </label>
    <div class="stats" aria-live="off">
      <div><b id="gen">0</b><span>generation</span></div>
      <div><b id="pop">0</b><span>alive</span></div>
    </div>
  </div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="Game of Life grid"></canvas></div>
</main>
</div>

<script>
const $ = id => document.getElementById(id);
const PATTERNS = {
  glider:  [".O.", "..O", "OOO"],
  lwss:    [".O..O", "O....", "O...O", "OOOO."],
  blinker: ["OOO"],
  pulsar:  ["..OOO...OOO..",".............","O....O.O....O","O....O.O....O","O....O.O....O","..OOO...OOO..",".............","..OOO...OOO..","O....O.O....O","O....O.O....O","O....O.O....O",".............","..OOO...OOO.."],
  penta:   ["..O....O..","OO.OOOO.OO","..O....O.."],
  rpent:   [".OO","OO.",".O."],
  acorn:   [".O.....","...O...","OO..OOO"],
  diehard: ["......O.","OO......",".O...OOO"],
  gun: ["........................O...........","......................O.O...........","............OO......OO............OO","...........O...O....OO............OO","OO........O.....O...OO..............","OO........O...O.OO....O.O...........","..........O.....O.......O...........","...........O...O....................","............OO......................"]
};

let cols = 80, rows = 50, cell = 10, grid, born, gen = 0, running = false, timer = null;
let B = Array(9).fill(false), S = Array(9).fill(false);
const cv = $("cv"), ctx = cv.getContext("2d");

function parseRule(str) {
  const m = /^\s*B([0-8]*)\s*\/\s*S([0-8]*)\s*$/i.exec(str);
  if (!m) return null;
  const b = Array(9).fill(false), s = Array(9).fill(false);
  for (const c of m[1]) b[+c] = true;
  for (const c of m[2]) s[+c] = true;
  return { b, s };
}

function applyRule() {
  const r = parseRule($("rule").value);
  $("rule").classList.toggle("bad", !r);
  if (!r) { $("ruleHint").textContent = "Invalid rule. Use the form B3/S23 with digits 0 to 8."; return; }
  B = r.b; S = r.s;
  $("ruleHint").textContent = "A dead cell is born with these neighbor counts (B); a live cell survives with these (S).";
  const match = [...$("preset").options].find(o => o.value.toLowerCase() === $("rule").value.replace(/\s/g, "").toLowerCase());
  $("preset").value = match ? match.value : "custom";
}

function clamp(v, lo, hi, d) { v = parseInt(v, 10); return isNaN(v) ? d : Math.min(hi, Math.max(lo, v)); }

function resize() {
  cols = clamp($("cols").value, 5, 300, 80);
  rows = clamp($("rows").value, 5, 300, 50);
  $("cols").value = cols; $("rows").value = rows;
  const old = grid, oc = oldCols, or = oldRows;
  grid = new Uint8Array(cols * rows);
  born = new Uint8Array(cols * rows);
  if (old) for (let y = 0; y < Math.min(rows, or); y++) for (let x = 0; x < Math.min(cols, oc); x++) grid[y * cols + x] = old[y * oc + x];
  oldCols = cols; oldRows = rows;
  layout(); update();
}
let oldCols = 0, oldRows = 0;

function layout() {
  const stage = $("stage");
  const w = stage.clientWidth - 22;
  const h = Math.max(300, window.innerHeight - 190);
  cell = Math.max(2, Math.floor(Math.min(w / cols, h / rows)));
  cv.width = cell * cols; cv.height = cell * rows;
  draw();
}

function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function draw() {
  const cellC = css("--cell"), bornC = css("--born"), gridC = css("--grid");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (cell >= 6) {
    ctx.fillStyle = gridC;
    for (let x = 0; x <= cols; x++) ctx.fillRect(x * cell, 0, 1, cv.height);
    for (let y = 0; y <= rows; y++) ctx.fillRect(0, y * cell, cv.width, 1);
  }
  const pad = cell >= 6 ? 1 : 0, sz = cell - pad;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x;
    if (!grid[i]) continue;
    ctx.fillStyle = born[i] ? bornC : cellC;
    ctx.fillRect(x * cell + pad, y * cell + pad, sz, sz);
  }
}

function update() {
  let n = 0; for (let i = 0; i < grid.length; i++) n += grid[i];
  $("gen").textContent = gen; $("pop").textContent = n;
  draw();
}

function step() {
  const wrap = $("wrap").checked, next = new Uint8Array(grid.length);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      let nx = x + dx, ny = y + dy;
      if (wrap) { nx = (nx + cols) % cols; ny = (ny + rows) % rows; }
      else if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      n += grid[ny * cols + nx];
    }
    const i = y * cols + x, alive = grid[i];
    const v = alive ? S[n] : B[n];
    next[i] = v ? 1 : 0;
    born[i] = (v && !alive) ? 1 : 0;
  }
  grid = next; gen++; update();
}

function loop() {
  if (!running) return;
  step();
  timer = setTimeout(loop, 1000 / +$("speed").value);
}
function setRunning(r) {
  running = r; clearTimeout(timer);
  $("play").textContent = r ? "Pause" : "Play";
  if (r) loop();
}

function clearGrid() { grid.fill(0); born.fill(0); gen = 0; update(); }

function loadPattern() {
  clearGrid();
  const p = $("pattern").value;
  if (p === "random") {
    const d = +$("density").value / 100;
    for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < d ? 1 : 0;
  } else {
    const rowsP = PATTERNS[p], ph = rowsP.length, pw = rowsP[0].length;
    const ox = Math.floor((cols - pw) / 2), oy = Math.floor((rows - ph) / 2);
    rowsP.forEach((line, y) => [...line].forEach((c, x) => {
      const gx = ox + x, gy = oy + y;
      if (c === "O" && gx >= 0 && gy >= 0 && gx < cols && gy < rows) grid[gy * cols + gx] = 1;
    }));
  }
  update();
}

// Drawing with pointer
let painting = null;
function cellAt(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / cell), y = Math.floor((e.clientY - r.top) / cell);
  return (x < 0 || y < 0 || x >= cols || y >= rows) ? -1 : y * cols + x;
}
cv.addEventListener("pointerdown", e => {
  const i = cellAt(e); if (i < 0) return;
  cv.setPointerCapture(e.pointerId);
  painting = grid[i] ? 0 : 1; grid[i] = painting; born[i] = 0; update();
});
cv.addEventListener("pointermove", e => {
  if (painting === null) return;
  const i = cellAt(e); if (i < 0 || grid[i] === painting) return;
  grid[i] = painting; born[i] = 0; update();
});
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => painting = null));

// Vertical splitter between parameters and visualization
const split = $("split"), app = document.querySelector(".app");
let dragging = false;
function setSide(w) {
  w = Math.min(560, Math.max(240, w));
  app.style.setProperty("--side", w + "px");
  layout();
}
split.addEventListener("pointerdown", e => { dragging = true; split.classList.add("on"); split.setPointerCapture(e.pointerId); });
split.addEventListener("pointermove", e => { if (dragging) setSide(e.clientX - app.getBoundingClientRect().left - 16); });
["pointerup", "pointercancel"].forEach(t => split.addEventListener(t, () => { dragging = false; split.classList.remove("on"); }));
split.addEventListener("dblclick", () => setSide(300));
split.addEventListener("keydown", e => {
  const cur = parseInt(app.style.getPropertyValue("--side"), 10) || 300;
  if (e.key === "ArrowLeft") { e.preventDefault(); setSide(cur - 20); }
  if (e.key === "ArrowRight") { e.preventDefault(); setSide(cur + 20); }
});

// Wiring
$("play").onclick = () => setRunning(!running);
$("step").onclick = () => { setRunning(false); step(); };
$("clear").onclick = () => { setRunning(false); clearGrid(); };
$("load").onclick = () => loadPattern();
$("speed").oninput = e => $("speedVal").textContent = e.target.value;
$("density").oninput = e => $("densityVal").textContent = e.target.value;
$("pattern").onchange = e => $("densityWrap").style.display = e.target.value === "random" ? "" : "none";
$("cols").onchange = $("rows").onchange = resize;
$("rule").oninput = applyRule;
$("preset").onchange = e => { if (e.target.value !== "custom") { $("rule").value = e.target.value; applyRule(); } };
window.addEventListener("resize", layout);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

applyRule(); resize(); loadPattern();
</script>
</body>
</html>
